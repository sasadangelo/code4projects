<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <marker id="arr4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2496ed"/>
    </marker>
    <marker id="arr4r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2496ed"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="url(#bg4)" rx="12"/>

  <!-- Title -->
  <text x="400" y="48" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Docker Networking</text>

  <!-- Bridge network boundary -->
  <rect x="60" y="70" width="680" height="240" rx="12" fill="none" stroke="#2496ed" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="110" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#2496ed">user-defined bridge: app-network (10.10.1.0/24)</text>

  <!-- Frontend container -->
  <rect x="100" y="115" width="200" height="160" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <rect x="100" y="115" width="200" height="32" rx="8" fill="#21262d"/>
  <rect x="100" y="134" width="200" height="13" fill="#21262d"/>
  <text x="200" y="136" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#388bfd" text-anchor="middle">frontend</text>
  <text x="200" y="168" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">image: nginx:alpine</text>
  <text x="200" y="192" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">port: 8080:80</text>
  <text x="200" y="216" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">IP: 10.10.1.2</text>
  <rect x="130" y="238" width="140" height="24" rx="4" fill="#388bfd" opacity="0.2"/>
  <text x="200" y="254" font-family="'Courier New', monospace" font-size="11" fill="#388bfd" text-anchor="middle">curl http://backend</text>

  <!-- Arrow between containers -->
  <path d="M302 195 L450 195" stroke="#2496ed" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr4)"/>
  <text x="376" y="185" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">DNS by name</text>
  <text x="376" y="210" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">no IP needed</text>

  <!-- Backend container -->
  <rect x="452" y="115" width="200" height="160" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <rect x="452" y="115" width="200" height="32" rx="8" fill="#21262d"/>
  <rect x="452" y="134" width="200" height="13" fill="#21262d"/>
  <text x="552" y="136" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#a371f7" text-anchor="middle">backend</text>
  <text x="552" y="168" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">image: nginx:alpine</text>
  <text x="552" y="192" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">port: internal only</text>
  <text x="552" y="216" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">IP: 10.10.1.3</text>

  <!-- Host -->
  <rect x="60" y="328" width="680" height="48" rx="8" fill="#161b22" stroke="#7ee787" stroke-width="1"/>
  <text x="400" y="357" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#7ee787" text-anchor="middle">Host · localhost:8080 → frontend:80</text>

  <!-- Arrow host to frontend -->
  <path d="M200 328 L200 277" stroke="#7ee787" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr4r)"/>

  <!-- Bottom -->
  <text x="400" y="410" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Getting Started with Docker Series · Part 4</text>
</svg>
