<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-labelledby="title description">
  <title id="title">FastAPI dependency injection request flow</title>
  <desc id="description">An incoming request branches to four dependency providers, then reaches the route handler and response before the database session closes.</desc>
  <rect width="760" height="550" fill="#f2f0e8"/>
  <rect width="760" height="7" fill="#26383b"/>
  <text x="38" y="31" fill="#3c6961" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">FASTURL / DEPENDENCY INJECTION</text>
  <text x="38" y="53" fill="#26383b" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="17" font-weight="700">Four provider calls feed the handler; cleanup follows the response.</text>
  <g font-family="Avenir Next, Helvetica Neue, sans-serif">
    <rect x="245" y="66" width="270" height="32" rx="16" fill="#26383b"/>
    <circle cx="266" cy="82" r="5" fill="#70d0bd"/>
    <text x="281" y="86" fill="#f2f0e8" font-size="11" font-weight="700">HTTP REQUEST ARRIVES</text>
    <rect x="379" y="98" width="2" height="10" fill="#35474a"/>
    <rect x="42" y="106" width="338" height="2" fill="#35474a"/>
    <rect x="41" y="107" width="2" height="231" fill="#35474a"/>
    <rect x="42" y="142" width="17" height="2" fill="#35474a"/>
    <path d="M58 138h9l-5 5 5 5h-9l5-5z" fill="#35474a"/>
    <rect x="42" y="203" width="17" height="2" fill="#35474a"/>
    <path d="M58 199h9l-5 5 5 5h-9l5-5z" fill="#35474a"/>
    <rect x="42" y="264" width="17" height="2" fill="#35474a"/>
    <path d="M58 260h9l-5 5 5 5h-9l5-5z" fill="#35474a"/>
    <rect x="42" y="325" width="17" height="2" fill="#35474a"/>
    <path d="M58 321h9l-5 5 5 5h-9l5-5z" fill="#35474a"/>
    <rect x="68" y="120" width="624" height="46" rx="5" fill="#70d0bd"/>
    <rect x="68" y="120" width="7" height="46" rx="3" fill="#35a996"/>
    <circle cx="96" cy="143" r="12" fill="#27383b" fill-opacity=".12"/>
    <text x="96" y="147" fill="#27383b" font-size="10" text-anchor="middle" font-weight="700">1</text>
    <text x="118" y="147" fill="#17272c" font-size="12" font-weight="700">Calls get_db()</text>
    <rect x="354" y="128" width="1" height="30" fill="#328e7f" fill-opacity=".65"/>
    <text x="374" y="147" fill="#27383b" font-size="11">Opens &amp; yields AsyncSession</text>
    <rect x="68" y="181" width="624" height="46" rx="5" fill="#f4a08d"/>
    <rect x="68" y="181" width="7" height="46" rx="3" fill="#d85a4b"/>
    <circle cx="96" cy="204" r="12" fill="#27383b" fill-opacity=".12"/>
    <text x="96" y="208" fill="#27383b" font-size="10" text-anchor="middle" font-weight="700">2</text>
    <text x="118" y="208" fill="#17272c" font-size="12" font-weight="700">Calls _get_link_repository()</text>
    <rect x="354" y="189" width="1" height="30" fill="#bd5347" fill-opacity=".65"/>
    <text x="374" y="208" fill="#27383b" font-size="10">Injects AsyncSession into LinkRepository</text>
    <rect x="68" y="242" width="624" height="46" rx="5" fill="#f17a65"/>
    <rect x="68" y="242" width="7" height="46" rx="3" fill="#d85a4b"/>
    <circle cx="96" cy="265" r="12" fill="#27383b" fill-opacity=".12"/>
    <text x="96" y="269" fill="#27383b" font-size="10" text-anchor="middle" font-weight="700">3</text>
    <text x="118" y="269" fill="#17272c" font-size="12" font-weight="700">Calls _get_link_service()</text>
    <rect x="354" y="250" width="1" height="30" fill="#bd5347" fill-opacity=".65"/>
    <text x="374" y="269" fill="#27383b" font-size="10">Injects LinkRepository into LinkService</text>
    <rect x="68" y="303" width="624" height="46" rx="5" fill="#e9b953"/>
    <rect x="68" y="303" width="7" height="46" rx="3" fill="#c28b24"/>
    <circle cx="96" cy="326" r="12" fill="#27383b" fill-opacity=".12"/>
    <text x="96" y="330" fill="#27383b" font-size="10" text-anchor="middle" font-weight="700">4</text>
    <text x="118" y="330" fill="#17272c" font-size="12" font-weight="700">Calls _get_http_client()</text>
    <rect x="354" y="311" width="1" height="30" fill="#a87b26" fill-opacity=".7"/>
    <text x="374" y="330" fill="#27383b" font-size="10">Gets shared httpx client from app.state</text>
    <rect x="379" y="349" width="2" height="15" fill="#35474a"/>
    <path d="M375 361h10l-5 7z" fill="#35474a"/>
    <rect x="205" y="372" width="350" height="44" rx="5" fill="#26383b"/>
    <circle cx="228" cy="394" r="6" fill="#70d0bd"/>
    <text x="244" y="391" fill="#f2f0e8" font-size="13" font-weight="700">Router handler</text>
    <text x="244" y="406" fill="#bacac0" font-size="10">Executes create_link()</text>
    <rect x="379" y="416" width="2" height="10" fill="#35474a"/>
    <path d="M375 423h10l-5 7z" fill="#35474a"/>
    <rect x="270" y="434" width="220" height="32" rx="16" fill="#35474a"/>
    <text x="380" y="454" fill="#f2f0e8" font-size="11" text-anchor="middle" font-weight="700">HTTP RESPONSE SENT</text>
    <rect x="379" y="466" width="2" height="13" fill="#35474a"/>
    <path d="M375 476h10l-5 7z" fill="#35474a"/>
    <rect x="184" y="488" width="392" height="48" rx="5" fill="#d8ded2"/>
    <circle cx="210" cy="512" r="6" fill="#3c6961"/>
    <text x="228" y="508" fill="#26383b" font-size="12" font-weight="700">5 · get_db() generator exits</text>
    <text x="228" y="524" fill="#405451" font-size="10">Closes AsyncSession after the response</text>
  </g>
</svg>