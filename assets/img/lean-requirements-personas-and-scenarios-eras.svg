<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">What Each Era Got Right, and Why It Collapsed</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#57606a">Every idea survived; most artifacts did not</text>

  <!-- Column backgrounds -->
  <rect x="370" y="68" width="185" height="312" fill="#dafbe1" fill-opacity="0.55"/>
  <rect x="555" y="68" width="185" height="312" fill="#ffebe9" fill-opacity="0.6"/>

  <!-- Header -->
  <rect x="20" y="68" width="720" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-size="11" font-weight="700" fill="#57606a">
    <text x="34" y="90">ERA</text>
    <text x="204" y="90">MAIN ARTIFACT</text>
    <text x="384" y="90" fill="#1a7f37">WHAT IT GOT RIGHT</text>
    <text x="569" y="90" fill="#cf222e">WHY IT COLLAPSED</text>
  </g>

  <!-- Row separators -->
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="20" y1="158" x2="740" y2="158"/>
    <line x1="20" y1="214" x2="740" y2="214"/>
    <line x1="20" y1="270" x2="740" y2="270"/>
    <line x1="20" y1="326" x2="740" y2="326"/>
    <line x1="20" y1="380" x2="740" y2="380"/>
  </g>

  <!-- Era markers (same colours as the timeline) -->
  <g stroke="#ffffff" stroke-width="1.5">
    <circle cx="34" cy="126" r="5" fill="#cf222e"/>
    <circle cx="34" cy="182" r="5" fill="#cf222e"/>
    <circle cx="34" cy="238" r="5" fill="#bf8700"/>
    <circle cx="34" cy="294" r="5" fill="#1a7f37"/>
    <circle cx="34" cy="350" r="5" fill="#8250df"/>
  </g>

  <g font-size="12" fill="#1f2328">
    <!-- Era column -->
    <g font-weight="700">
      <text x="46" y="130">Waterfall</text>
      <text x="46" y="186">UML</text>
      <text x="46" y="242">Personas</text>
      <text x="46" y="298">Agile</text>
      <text x="46" y="354">DDD · BDD · Job Stories</text>
    </g>
    <g font-size="10.5" fill="#57606a" font-family="ui-monospace,Menlo,monospace">
      <text x="46" y="146">1970s–1990s</text>
      <text x="46" y="202">1990s–2000s</text>
      <text x="46" y="258">late 1990s</text>
      <text x="46" y="314">2001+</text>
      <text x="46" y="370">2003–2013</text>
    </g>

    <!-- Main artifact -->
    <text x="204" y="126">Software Requirements</text>
    <text x="204" y="143">Specification</text>
    <text x="204" y="182">Use case and</text>
    <text x="204" y="199">UML diagrams</text>
    <text x="204" y="246">User profiles</text>
    <text x="204" y="302">User stories on cards</text>
    <text x="204" y="350">Ubiquitous language,</text>
    <text x="204" y="367">Given/When/Then</text>

    <!-- What it got right -->
    <g fill="#116329">
      <text x="384" y="126">Constraints and scope</text>
      <text x="384" y="143">written down</text>
      <text x="384" y="182">Main scenario plus</text>
      <text x="384" y="199">extensions</text>
      <text x="384" y="238">Design for a</text>
      <text x="384" y="255">specific goal</text>
      <text x="384" y="294">Small, negotiable</text>
      <text x="384" y="311">increments</text>
      <text x="384" y="350">Shared words and</text>
      <text x="384" y="367">testable criteria</text>
    </g>

    <!-- Why it collapsed -->
    <g fill="#a40e26">
      <text x="569" y="126">Obsolete the day</text>
      <text x="569" y="143">after sign-off</text>
      <text x="569" y="182">Diagrams too costly</text>
      <text x="569" y="199">to keep in sync</text>
      <text x="569" y="238">Detail turned into</text>
      <text x="569" y="255">decoration</text>
      <text x="569" y="294">The conversation is</text>
      <text x="569" y="311">never written down</text>
      <text x="569" y="350">Rarely collected</text>
      <text x="569" y="367">in one place</text>
    </g>
  </g>
</svg>
