  <text x="284" y="213" text-anchor="start" font-size="10.5" fill="#57606a">become operations</text>
  <rect x="284" y="226" width="192" height="24" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1"/>
  <text x="380.0" y="242" text-anchor="middle" font-size="11" fill="#15803d" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-weight="700">shorten</text>
  <line x1="624.0" y1="146" x2="624.0" y2="168" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="512" y="172" width="224" height="150" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="528" y="196" text-anchor="start" font-size="11" fill="#b45309" font-weight="700" letter-spacing="0.6">CONDITIONS</text>
  <text x="528" y="213" text-anchor="start" font-size="10.5" fill="#57606a">become rules</text>
  <rect x="528" y="226" width="192" height="24" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1"/>
  <text x="624.0" y="242" text-anchor="middle" font-size="11" fill="#b45309" font-weight="700">URL is HTTP or HTTPS</text>
  <rect x="528" y="256" width="192" height="24" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1"/>
  <text x="624.0" y="272" text-anchor="middle" font-size="11" fill="#b45309" font-weight="700">code is unique</text>
