  <line x1="587" y1="378" x2="598" y2="378" stroke="#57606a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="600" y="362" width="130" height="32" rx="16" fill="#f7f8fa" stroke="#d1d5db" stroke-width="1.2"/>
  <circle cx="618" cy="378" r="10" fill="#7c5cd8"/>
  <text x="618" y="382" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="700">5</text>
  <text x="674" y="382" text-anchor="middle" font-size="11" fill="#1f2328" font-weight="700">Conditions</text>
