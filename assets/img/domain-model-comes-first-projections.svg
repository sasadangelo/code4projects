<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 478" width="760" height="478">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 Z" fill="#57606a"/></marker>
  </defs>
  <rect width="760" height="478" fill="#ffffff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#1f2328" font-weight="700">Many Projections of One Model</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#57606a">The model decides the names; each projection adds constraints of its own</text>
  <rect x="24" y="70" width="236" height="372" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="42" y="94" text-anchor="start" font-size="11" fill="#6d28d9" font-weight="700" letter-spacing="0.6">DOMAIN MODEL</text>
  <rect x="38" y="106" width="208" height="150" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="52" y="128" text-anchor="start" font-size="13" fill="#6d28d9" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-weight="700">Link</text>
  <text x="232" y="128" text-anchor="end" font-size="9.5" fill="#57606a" font-style="italic">aggregate</text>
  <text x="52" y="150" text-anchor="start" font-size="10" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">code</text>
  <text x="232" y="150" text-anchor="end" font-size="10" fill="#6d28d9" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">ShortCode</text>
  <text x="52" y="167" text-anchor="start" font-size="10" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">target_url</text>
  <text x="232" y="167" text-anchor="end" font-size="10" fill="#6d28d9" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">TargetUrl</text>
  <text x="52" y="184" text-anchor="start" font-size="10" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">is_active</text>
  <text x="232" y="184" text-anchor="end" font-size="10" fill="#6d28d9" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">bool</text>
  <text x="52" y="201" text-anchor="start" font-size="10" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">expires_at</text>
  <text x="232" y="201" text-anchor="end" font-size="10" fill="#6d28d9" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">datetime</text>
  <text x="52" y="218" text-anchor="start" font-size="10" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">inspection</text>
  <text x="232" y="218" text-anchor="end" font-size="10" fill="#6d28d9" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">LinkInspection</text>
  <text x="52" y="235" text-anchor="start" font-size="10" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">metrics</text>
  <text x="232" y="235" text-anchor="end" font-size="10" fill="#6d28d9" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">LinkMetrics</text>
  <text x="42" y="280" text-anchor="start" font-size="10" fill="#6d28d9" font-weight="700" letter-spacing="0.5">OPERATIONS</text>
  <text x="42" y="298" text-anchor="start" font-size="9.5" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">shorten · resolve · inspect · delete</text>
  <rect x="38" y="318" width="208" height="110" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="52" y="338" text-anchor="start" font-size="10" fill="#b91c1c" font-weight="700" letter-spacing="0.4">RULES STAY IN THE CORE</text>
  <text x="52" y="360" text-anchor="start" font-size="10.5" fill="#1f2328">• expired or inactive: no redirect</text>
  <text x="52" y="378" text-anchor="start" font-size="10.5" fill="#1f2328">• a short code is unique</text>
  <text x="52" y="396" text-anchor="start" font-size="10.5" fill="#1f2328">• no redirect back to FastURL</text>
  <text x="52" y="418" text-anchor="start" font-size="9.5" fill="#b91c1c" font-style="italic">they project nowhere</text>
  <rect x="330" y="76" width="406" height="66" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <path d="M338 76 h104 v66 h-104 a8 8 0 0 1 -8 -8 v-50 a8 8 0 0 1 8 -8z" fill="#fef3c7"/>
  <line x1="442" y1="76" x2="442" y2="142" stroke="#d1d5db" stroke-width="1"/>
  <text x="386" y="113.0" text-anchor="middle" font-size="12" fill="#d97706" font-weight="700">Database</text>
  <text x="456" y="104" text-anchor="start" font-size="10.5" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">links (code PK, target_url, is_active, …)</text>
  <text x="456" y="123" text-anchor="start" font-size="10.5" fill="#57606a">entity → table · value objects → columns</text>
  <line x1="262" y1="240" x2="326" y2="109.0" stroke="#7c3aed" stroke-width="1.3" stroke-opacity="0.7" marker-end="url(#arrow)"/>
  <rect x="330" y="150" width="406" height="66" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <path d="M338 150 h104 v66 h-104 a8 8 0 0 1 -8 -8 v-50 a8 8 0 0 1 8 -8z" fill="#ccfbf1"/>
  <line x1="442" y1="150" x2="442" y2="216" stroke="#d1d5db" stroke-width="1"/>
  <text x="386" y="187.0" text-anchor="middle" font-size="12" fill="#0d9488" font-weight="700">REST API</text>
  <text x="456" y="178" text-anchor="start" font-size="10.5" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">POST /api/v1/links · GET …/links/{code}</text>
  <text x="456" y="197" text-anchor="start" font-size="10.5" fill="#57606a">entity → resource · operations → HTTP methods</text>
  <line x1="262" y1="240" x2="326" y2="183.0" stroke="#7c3aed" stroke-width="1.3" stroke-opacity="0.7" marker-end="url(#arrow)"/>
  <rect x="330" y="224" width="406" height="66" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <path d="M338 224 h104 v66 h-104 a8 8 0 0 1 -8 -8 v-50 a8 8 0 0 1 8 -8z" fill="#dbeafe"/>
  <line x1="442" y1="224" x2="442" y2="290" stroke="#d1d5db" stroke-width="1"/>
  <text x="386" y="261.0" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700">CLI</text>
  <text x="456" y="252" text-anchor="start" font-size="10.5" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">fasturl links create &lt;url&gt; --alias …</text>
  <text x="456" y="271" text-anchor="start" font-size="10.5" fill="#57606a">entity → command group · operations → verbs</text>
  <line x1="262" y1="240" x2="326" y2="257.0" stroke="#7c3aed" stroke-width="1.3" stroke-opacity="0.7" marker-end="url(#arrow)"/>
  <rect x="330" y="298" width="406" height="66" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <path d="M338 298 h104 v66 h-104 a8 8 0 0 1 -8 -8 v-50 a8 8 0 0 1 8 -8z" fill="#e0f2fe"/>
  <line x1="442" y1="298" x2="442" y2="364" stroke="#d1d5db" stroke-width="1"/>
  <text x="386" y="335.0" text-anchor="middle" font-size="12" fill="#0369a1" font-weight="700">SDK</text>
  <text x="456" y="326" text-anchor="start" font-size="10.5" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">client.links.create(url, alias=…)</text>
  <text x="456" y="345" text-anchor="start" font-size="10.5" fill="#57606a">operations → methods · rules → exceptions</text>
  <line x1="262" y1="240" x2="326" y2="331.0" stroke="#7c3aed" stroke-width="1.3" stroke-opacity="0.7" marker-end="url(#arrow)"/>
  <rect x="330" y="372" width="406" height="66" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <path d="M338 372 h104 v66 h-104 a8 8 0 0 1 -8 -8 v-50 a8 8 0 0 1 8 -8z" fill="#fce7f3"/>
  <line x1="442" y1="372" x2="442" y2="438" stroke="#d1d5db" stroke-width="1"/>
  <text x="386" y="409.0" text-anchor="middle" font-size="12" fill="#db2777" font-weight="700">User interface</text>
  <text x="456" y="400" text-anchor="start" font-size="10.5" fill="#1f2328">“Shorten” screen: one field, one button</text>
  <text x="456" y="419" text-anchor="start" font-size="10.5" fill="#57606a">designed around the task, not the entity</text>
  <line x1="262" y1="240" x2="326" y2="405.0" stroke="#7c3aed" stroke-width="1.3" stroke-opacity="0.7" marker-end="url(#arrow)"/>
  <text x="380" y="466" text-anchor="middle" font-size="11.5" fill="#57606a">Same names in every projection: Link, ShortCode, TargetUrl, inspect.</text>
  </g>
</svg>
