<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Collecting Requirements in Three Rounds</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#57606a">One question at a time; confirm before moving to the next round</text>

  <!-- Input -->
  <rect x="24" y="70" width="712" height="34" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/>
  <text x="380" y="92" text-anchor="middle" font-size="12" fill="#57606a">Start from what already exists: <tspan font-family="ui-monospace,Menlo,monospace" fill="#1f2328">idea.md</tspan>, meeting notes, an email thread, an old specification</text>

  <!-- Round 1 -->
  <rect x="24" y="124" width="224" height="222" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <rect x="24" y="124" width="224" height="34" rx="10" fill="#0969da"/>
  <rect x="24" y="146" width="224" height="12" fill="#0969da"/>
  <text x="136" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Round 1 · Big picture</text>
  <g font-size="11.5" fill="#1f2328">
    <text x="40" y="180">1. System name</text>
    <text x="40" y="200">2. Purpose</text>
    <text x="40" y="220">3. Actors</text>
    <text x="40" y="240">4. Goals per actor</text>
    <text x="40" y="260">5. Business constraints</text>
    <text x="40" y="280">6. Non-functional requirements</text>
    <text x="40" y="300">7. Out of scope</text>
  </g>
  <text x="136" y="330" text-anchor="middle" font-size="10.5" font-style="italic" fill="#0969da">✓ read back a summary</text>

  <!-- Round 2 -->
  <rect x="268" y="124" width="224" height="222" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.6"/>
  <rect x="268" y="124" width="224" height="34" rx="10" fill="#8250df"/>
  <rect x="268" y="146" width="224" height="12" fill="#8250df"/>
  <text x="380" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Round 2 · Stories</text>
  <g font-size="11.5" fill="#1f2328">
    <text x="284" y="182" font-weight="700">For each actor and goal:</text>
    <text x="284" y="204">"What situation triggers it,</text>
    <text x="284" y="220">and what outcome do you expect?"</text>
    <text x="292" y="240" font-size="10.5" fill="#8250df">→ job story</text>
    <text x="284" y="268">"What can go wrong?"</text>
    <text x="292" y="288" font-size="10.5" fill="#8250df">→ alternative scenarios</text>
  </g>
  <text x="380" y="330" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8250df">✓ confirm the story list</text>

  <!-- Round 3 -->
  <rect x="512" y="124" width="224" height="222" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/>
  <rect x="512" y="124" width="224" height="34" rx="10" fill="#1a7f37"/>
  <rect x="512" y="146" width="224" height="12" fill="#1a7f37"/>
  <text x="624" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Round 3 · Criteria</text>
  <g font-size="11.5" fill="#1f2328">
    <text x="528" y="182" font-weight="700">For each story:</text>
    <text x="528" y="204">"What must be true</text>
    <text x="528" y="220">for this to be done?"</text>
    <text x="536" y="244" font-size="10.5" fill="#1a7f37">→ 2–4 Given / When / Then</text>
    <text x="536" y="264" font-size="10.5" fill="#1a7f37">→ ≥ 1 main scenario</text>
    <text x="536" y="284" font-size="10.5" fill="#1a7f37">→ ≥ 1 alternative</text>
  </g>
  <text x="624" y="330" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a7f37">✓ observable behaviour only</text>

  <!-- Round arrows -->
  <g stroke="#57606a" stroke-width="1.6">
    <line x1="250" y1="235" x2="264" y2="235" marker-end="url(#arrow)"/>
    <line x1="494" y1="235" x2="508" y2="235" marker-end="url(#arrow)"/>
  </g>

  <!-- Outputs -->
  <g stroke="#8c959f" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="136" y1="348" x2="136" y2="372"/>
    <line x1="380" y1="348" x2="380" y2="372"/>
    <line x1="624" y1="348" x2="624" y2="372"/>
  </g>
  <rect x="24" y="374" width="712" height="46" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#1f2328" text-anchor="middle">
    <text x="136" y="394">Overview · Actors</text>
    <text x="136" y="410">Constraints · NFRs · Scope</text>
    <text x="380" y="394">Job Stories</text>
    <text x="380" y="410">(main + alternatives)</text>
    <text x="624" y="394">Acceptance criteria</text>
    <text x="624" y="410">per story</text>
  </g>
</svg>
