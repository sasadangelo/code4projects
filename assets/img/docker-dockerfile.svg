<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg3)" rx="12"/>

  <!-- Title -->
  <text x="400" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">Dockerfile &amp; Image Layers</text>

  <!-- Dockerfile box -->
  <rect x="40" y="80" width="200" height="240" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="80" width="200" height="34" rx="8" fill="#21262d"/>
  <rect x="40" y="101" width="200" height="13" rx="0" fill="#21262d"/>
  <text x="140" y="103" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#2496ed" text-anchor="middle">Dockerfile</text>

  <text x="55" y="138" font-family="'Courier New', monospace" font-size="12" fill="#7ee787">FROM</text>
  <text x="100" y="138" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3"> nginx:alpine</text>
  <text x="55" y="162" font-family="'Courier New', monospace" font-size="12" fill="#7ee787">COPY</text>
  <text x="100" y="162" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3"> html /usr/…</text>
  <text x="55" y="186" font-family="'Courier New', monospace" font-size="12" fill="#7ee787">RUN</text>
  <text x="95" y="186" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3"> apk add curl</text>
  <text x="55" y="210" font-family="'Courier New', monospace" font-size="12" fill="#7ee787">USER</text>
  <text x="100" y="210" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3"> nginx</text>
  <text x="55" y="234" font-family="'Courier New', monospace" font-size="12" fill="#7ee787">EXPOSE</text>
  <text x="113" y="234" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3"> 80</text>
  <text x="55" y="258" font-family="'Courier New', monospace" font-size="12" fill="#7ee787">CMD</text>
  <text x="90" y="258" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3"> ["nginx"…]</text>
  <text x="55" y="282" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3"> </text>

  <!-- Arrow -->
  <path d="M250 200 L310 200" stroke="#2496ed" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2496ed"/>
    </marker>
  </defs>
  <text x="270" y="192" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">docker</text>
  <text x="270" y="208" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">build</text>

  <!-- Image layers -->
  <g transform="translate(320, 80)">
    <text x="165" y="25" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#8b949e" text-anchor="middle">Image (read-only layers)</text>

    <!-- Layer 5 - CMD (top) -->
    <rect x="80" y="40" width="170" height="34" rx="5" fill="#2496ed" opacity="0.9"/>
    <text x="165" y="61" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">CMD layer</text>

    <!-- Layer 4 - EXPOSE -->
    <rect x="60" y="80" width="210" height="34" rx="5" fill="#2496ed" opacity="0.75"/>
    <text x="165" y="101" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">USER / EXPOSE layer</text>

    <!-- Layer 3 - RUN -->
    <rect x="40" y="120" width="250" height="34" rx="5" fill="#2496ed" opacity="0.6"/>
    <text x="165" y="141" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">RUN layer</text>

    <!-- Layer 2 - COPY -->
    <rect x="20" y="160" width="290" height="34" rx="5" fill="#2496ed" opacity="0.45"/>
    <text x="165" y="181" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">COPY layer</text>

    <!-- Layer 1 - FROM (base) -->
    <rect x="0" y="200" width="330" height="34" rx="5" fill="#388bfd" opacity="0.35"/>
    <text x="165" y="221" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">FROM nginx:alpine (base)</text>

    <!-- Cache badge -->
    <rect x="90" y="248" width="150" height="26" rx="13" fill="#7ee787" opacity="0.2"/>
    <text x="165" y="265" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#7ee787" text-anchor="middle">⚡ cached if unchanged</text>
  </g>

  <!-- Bottom -->
  <line x1="40" y1="370" x2="760" y2="370" stroke="#2496ed" stroke-width="1" opacity="0.3"/>
  <text x="400" y="395" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Getting Started with Docker Series · Part 3</text>
</svg>
