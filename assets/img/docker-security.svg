<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg7)" rx="12"/>

  <!-- Shield icon -->
  <g transform="translate(50, 60)">
    <path d="M75 0 L150 30 L150 90 Q150 150 75 180 Q0 150 0 90 L0 30 Z" fill="none" stroke="#7ee787" stroke-width="3"/>
    <path d="M75 10 L140 36 L140 90 Q140 142 75 168 Q10 142 10 90 L10 36 Z" fill="#7ee787" opacity="0.08"/>
    <!-- Check mark inside shield -->
    <path d="M42 90 L65 113 L108 68" fill="none" stroke="#7ee787" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="270" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Docker Security</text>
  <text x="270" y="150" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" fill="#7ee787">Best Practices</text>

  <!-- Practice cards -->
  <g transform="translate(270, 175)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="150" height="46" rx="6" fill="#161b22" stroke="#7ee787" stroke-width="1"/>
    <text x="12" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#7ee787">USER nginx</text>
    <text x="12" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">Run as non-root</text>

    <rect x="163" y="0" width="150" height="46" rx="6" fill="#161b22" stroke="#7ee787" stroke-width="1"/>
    <text x="175" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#7ee787">--read-only</text>
    <text x="175" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">Immutable filesystem</text>

    <rect x="326" y="0" width="170" height="46" rx="6" fill="#161b22" stroke="#7ee787" stroke-width="1"/>
    <text x="338" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#7ee787">--cap-drop=ALL</text>
    <text x="338" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">Drop Linux capabilities</text>

    <!-- Row 2 -->
    <rect x="0" y="60" width="150" height="46" rx="6" fill="#161b22" stroke="#f78166" stroke-width="1"/>
    <text x="12" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f78166">No secrets in ENV</text>
    <text x="12" y="98" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">Use Docker secrets</text>

    <rect x="163" y="60" width="150" height="46" rx="6" fill="#161b22" stroke="#2496ed" stroke-width="1"/>
    <text x="175" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#2496ed">nginx:alpine</text>
    <text x="175" y="98" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">Minimal base image</text>

    <rect x="326" y="60" width="170" height="46" rx="6" fill="#161b22" stroke="#2496ed" stroke-width="1"/>
    <text x="338" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#2496ed">docker scout cves</text>
    <text x="338" y="98" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">Scan for vulnerabilities</text>
  </g>

  <!-- Bottom line -->
  <line x1="40" y1="370" x2="760" y2="370" stroke="#7ee787" stroke-width="1" opacity="0.3"/>
  <text x="400" y="395" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Getting Started with Docker Series · Part 7</text>
</svg>
