<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title description">
  <title id="title">FastURL layered architecture overview</title>
  <desc id="description">HTTP requests pass through the router, service, and repository layers before reaching the SQL database. Each layer has a distinct responsibility.</desc>
  <defs>
  </defs>
  <rect width="760" height="400" fill="#f2f0e8"/>
  <rect x="0" y="0" width="760" height="7" fill="#26383b"/>
  <text x="38" y="36" fill="#3c6961" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">FASTURL / REQUEST PATH</text>
  <text x="38" y="62" fill="#26383b" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="19" font-weight="700">Each layer owns one concern</text>
  <g font-family="Avenir Next, Helvetica Neue, sans-serif">
    <rect x="245" y="77" width="270" height="34" rx="17" fill="#26383b"/>
    <circle cx="266" cy="94" r="5" fill="#70d0bd"/>
    <text x="281" y="99" fill="#f2f0e8" font-size="12" font-weight="700">HTTP REQUEST</text>
    <text x="496" y="99" fill="#bacac0" font-size="10" text-anchor="end">CLIENT</text>
    <rect x="379" y="113" width="2" height="13" fill="#35474a"/>
    <path d="M375 124h10l-5 6z" fill="#35474a"/>
    <rect x="52" y="132" width="656" height="49" rx="5" fill="#f17a65"/>
    <rect x="52" y="132" width="8" height="49" rx="4" fill="#d85a4b"/>
    <circle cx="84" cy="156" r="13" fill="#27383b" fill-opacity=".12"/>
    <text x="84" y="160" fill="#27383b" text-anchor="middle" font-size="10" font-weight="700">01</text>
    <text x="108" y="153" fill="#17272c" font-size="15" font-weight="700">ROUTER</text>
    <text x="108" y="169" fill="#27383b" font-size="10">HTTP boundary</text>
    <path d="M263 141v31" stroke="#bd5347" stroke-opacity=".55"/>
    <text x="285" y="153" fill="#27383b" font-size="11">Parses requests</text>
    <text x="285" y="168" fill="#27383b" font-size="11">Validates with Pydantic</text>
    <text x="520" y="153" fill="#27383b" font-size="11">Calls services</text>
    <text x="520" y="168" fill="#27383b" font-size="11">Returns DTOs</text>
    <rect x="379" y="183" width="2" height="13" fill="#35474a"/>
    <path d="M375 194h10l-5 6z" fill="#35474a"/>
    <rect x="52" y="202" width="656" height="49" rx="5" fill="#70d0bd"/>
    <rect x="52" y="202" width="8" height="49" rx="4" fill="#35a996"/>
    <circle cx="84" cy="226" r="13" fill="#27383b" fill-opacity=".12"/>
    <text x="84" y="230" fill="#27383b" text-anchor="middle" font-size="10" font-weight="700">02</text>
    <text x="108" y="223" fill="#17272c" font-size="15" font-weight="700">SERVICE</text>
    <text x="108" y="239" fill="#27383b" font-size="10">Business layer</text>
    <path d="M263 211v31" stroke="#328e7f" stroke-opacity=".55"/>
    <text x="285" y="223" fill="#27383b" font-size="11">Orchestrates workflows</text>
    <text x="285" y="238" fill="#27383b" font-size="11">Enforces domain rules</text>
    <text x="520" y="223" fill="#27383b" font-size="11">Calls repositories</text>
    <text x="520" y="238" fill="#27383b" font-size="11">Knows no HTTP</text>
    <rect x="379" y="253" width="2" height="13" fill="#35474a"/>
    <path d="M375 264h10l-5 6z" fill="#35474a"/>
    <rect x="52" y="272" width="656" height="49" rx="5" fill="#e9b953"/>
    <rect x="52" y="272" width="8" height="49" rx="4" fill="#c28b24"/>
    <circle cx="84" cy="296" r="13" fill="#27383b" fill-opacity=".12"/>
    <text x="84" y="300" fill="#27383b" text-anchor="middle" font-size="10" font-weight="700">03</text>
    <text x="108" y="293" fill="#17272c" font-size="15" font-weight="700">REPOSITORY</text>
    <text x="108" y="309" fill="#27383b" font-size="10">Data layer</text>
    <path d="M263 281v31" stroke="#a87b26" stroke-opacity=".6"/>
    <text x="285" y="293" fill="#27383b" font-size="11">Queries via AsyncSession</text>
    <text x="285" y="308" fill="#27383b" font-size="11">Maps SQLAlchemy models</text>
    <text x="520" y="293" fill="#27383b" font-size="11">Persists data</text>
    <text x="520" y="308" fill="#27383b" font-size="11">Hides SQL details</text>
    <rect x="379" y="323" width="2" height="7" fill="#35474a"/>
    <path d="M375 328h10l-5 6z" fill="#35474a"/>
    <ellipse cx="380" cy="346" rx="72" ry="9" fill="#35474a"/>
    <path d="M308 346v15c0 6 32 10 72 10s72-4 72-10v-15" fill="#526663" stroke="#35474a" stroke-width="1.5"/>
    <ellipse cx="380" cy="361" rx="72" ry="9" fill="#526663" stroke="#35474a" stroke-width="1.5"/>
    <text x="380" y="365" fill="#f2f0e8" font-size="10" text-anchor="middle" font-weight="700">SQL DATABASE</text>
  </g>
</svg>