  <text x="689" y="200" text-anchor="middle" font-size="10" fill="#1f2328" font-weight="700">Micro-</text>
  <text x="689" y="211" text-anchor="middle" font-size="10" fill="#1f2328" font-weight="700">services</text>
  <text x="408" y="250" text-anchor="start" font-size="10" fill="#57606a" font-weight="700">Unit of design</text>
  <text x="408" y="266" text-anchor="start" font-size="11.5" fill="#1f2328">modules, services, messages, deployments</text>
  <text x="408" y="292" text-anchor="start" font-size="10" fill="#57606a" font-weight="700">Typical driver</text>
  <text x="408" y="308" text-anchor="start" font-size="11.5" fill="#1f2328">team size, independent scaling and releases</text>
