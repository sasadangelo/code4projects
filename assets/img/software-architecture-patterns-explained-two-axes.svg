  <text x="380" y="196" text-anchor="middle" font-size="17" fill="#57606a" font-weight="700">+</text>
  <text x="380" y="356" text-anchor="middle" font-size="11.5" fill="#57606a">The two axes combine: every microservice still needs an internal organization.</text>
