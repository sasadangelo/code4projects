  <text x="38" y="250" text-anchor="start" font-size="10" fill="#57606a" font-weight="700">Unit of design</text>
  <text x="38" y="266" text-anchor="start" font-size="11.5" fill="#1f2328">packages, modules, classes, imports</text>
  <text x="38" y="292" text-anchor="start" font-size="10" fill="#57606a" font-weight="700">Typical driver</text>
  <text x="38" y="308" text-anchor="start" font-size="11.5" fill="#1f2328">testability, changing frameworks or databases</text>
