  <circle cx="319" cy="166" r="18.0" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="319" cy="166" r="14.5" fill="#dc2626" fill-opacity="0.35" stroke="#dc2626" stroke-width="1.5"/>
