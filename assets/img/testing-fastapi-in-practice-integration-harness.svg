<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#57606a"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="450" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f2328">The api_client Fixture: The Real App, Without a Server</text>
  <text x="380" y="54" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#57606a">ASGITransport replaces the socket; dependency_overrides replaces the database and the network</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
    <!-- ── Left column: client side ── -->
    <rect x="30" y="86" width="180" height="52" rx="8" fill="#f7f8fa" stroke="#d1d5db" stroke-width="1.2"/>
    <text x="120" y="107" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">Test</text>
    <text x="120" y="125" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#57606a">await api_client.post(...)</text>

    <line x1="120" y1="138" x2="120" y2="161" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="30" y="164" width="180" height="52" rx="8" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.2"/>
    <text x="120" y="185" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#2563eb">httpx.AsyncClient</text>
    <text x="120" y="203" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#57606a">base_url="http://test"</text>

    <line x1="120" y1="216" x2="120" y2="239" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="30" y="242" width="180" height="60" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
    <text x="120" y="263" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#0f766e">ASGITransport(app)</text>
    <text x="120" y="280" text-anchor="middle" font-size="10" fill="#57606a">no port, no socket:</text>
    <text x="120" y="294" text-anchor="middle" font-size="10" fill="#57606a">the round trip is a function call</text>

    <!-- transport → app -->
    <line x1="210" y1="272" x2="248" y2="272" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- ── App box ── -->
    <rect x="252" y="80" width="484" height="210" rx="10" fill="#f7f8fa" stroke="#7c5cd8" stroke-width="1.6"/>
    <text x="268" y="104" font-size="13" font-weight="700" fill="#1f2328">FastAPI app</text>
    <text x="358" y="104" font-size="11" fill="#57606a">— the same code path as production</text>

    <!-- pipeline chips -->
    <rect x="268" y="120" width="84" height="30" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="310" y="139" text-anchor="middle" font-size="11" fill="#1f2328">middleware</text>
    <line x1="352" y1="135" x2="362" y2="135" stroke="#57606a" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="364" y="120" width="84" height="30" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="406" y="139" text-anchor="middle" font-size="11" fill="#1f2328">validation</text>
    <line x1="448" y1="135" x2="458" y2="135" stroke="#57606a" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="460" y="120" width="64" height="30" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="492" y="139" text-anchor="middle" font-size="11" fill="#1f2328">router</text>
    <line x1="524" y1="135" x2="534" y2="135" stroke="#57606a" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="536" y="120" width="84" height="30" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="578" y="139" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#1f2328">LinkService</text>
    <line x1="620" y1="135" x2="630" y2="135" stroke="#57606a" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="632" y="120" width="88" height="30" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="676" y="133" text-anchor="middle" font-size="10" fill="#1f2328">background</text>
    <text x="676" y="145" text-anchor="middle" font-size="10" fill="#1f2328">inspection</text>

    <text x="494" y="184" text-anchor="middle" font-size="11" fill="#57606a">FastAPI resolves each Depends(...) per request</text>

    <!-- Depends chips -->
    <rect x="290" y="204" width="180" height="40" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
    <text x="380" y="229" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="700" fill="#6d28d9">Depends(get_db)</text>
    <rect x="520" y="204" width="200" height="40" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
    <text x="620" y="229" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="700" fill="#6d28d9">Depends(get_http_client)</text>

    <!-- override arrows -->
    <line x1="380" y1="244" x2="380" y2="334" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
    <line x1="620" y1="244" x2="620" y2="334" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
    <rect x="410" y="300" width="180" height="22" rx="11" fill="#d97706"/>
    <text x="500" y="315" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="700" fill="#ffffff">app.dependency_overrides</text>

    <!-- replacements -->
    <rect x="290" y="338" width="180" height="54" rx="8" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.2"/>
    <text x="380" y="360" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#2563eb">db_session</text>
    <text x="380" y="379" text-anchor="middle" font-size="10" fill="#57606a">fresh in-memory SQLite per test</text>

    <rect x="520" y="338" width="200" height="54" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
    <text x="620" y="360" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#047857">http_client</text>
    <text x="620" y="379" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#57606a">MockTransport → FAKE_PAGE</text>

    <!-- blocked internet -->
    <text x="620" y="410" text-anchor="middle" font-size="11" fill="#dc2626"><tspan font-family="ui-monospace,Menlo,monospace" text-decoration="line-through">https://example.com</tspan>  never called</text>

    <!-- test shares the same session -->
    <path d="M30 112 H16 V365 H286" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
    <text x="28" y="330" font-size="10" fill="#2563eb">the test inserts rows</text>
    <text x="28" y="344" font-size="10" fill="#2563eb">into the same session</text>
  </g>

  <!-- Footer -->
  <text x="380" y="438" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#57606a">After yield, <tspan font-family="ui-monospace,Menlo,monospace">app.dependency_overrides.clear()</tspan> runs even when the test fails.</text>
</svg>
