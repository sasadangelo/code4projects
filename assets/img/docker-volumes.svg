<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <marker id="arr5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2496ed"/>
    </marker>
    <marker id="arr5g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7ee787"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="url(#bg5)" rx="12"/>

  <!-- Title -->
  <text x="400" y="48" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Docker Storage Types</text>

  <!-- VOLUME -->
  <rect x="40" y="72" width="220" height="230" rx="10" fill="#161b22" stroke="#2496ed" stroke-width="1.5"/>
  <rect x="40" y="72" width="220" height="36" rx="10" fill="#21262d"/>
  <rect x="40" y="93" width="220" height="15" fill="#21262d"/>
  <text x="150" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#2496ed" text-anchor="middle">Named Volume</text>
  <text x="150" y="138" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Managed by Docker</text>
  <rect x="65" y="152" width="170" height="28" rx="5" fill="#2496ed" opacity="0.15"/>
  <text x="150" y="170" font-family="'Courier New', monospace" font-size="11" fill="#2496ed" text-anchor="middle">/var/lib/docker/volumes/</text>
  <text x="150" y="210" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">✓ Survives container removal</text>
  <text x="150" y="232" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">✓ Shareable across containers</text>
  <text x="150" y="254" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">✓ Works on Linux + Windows</text>
  <text x="150" y="285" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">Best for production data</text>

  <!-- BIND MOUNT -->
  <rect x="290" y="72" width="220" height="230" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <rect x="290" y="72" width="220" height="36" rx="10" fill="#21262d"/>
  <rect x="290" y="93" width="220" height="15" fill="#21262d"/>
  <text x="400" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#a371f7" text-anchor="middle">Bind Mount</text>
  <text x="400" y="138" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Host path ↔ Container path</text>
  <rect x="315" y="152" width="170" height="28" rx="5" fill="#a371f7" opacity="0.15"/>
  <text x="400" y="170" font-family="'Courier New', monospace" font-size="11" fill="#a371f7" text-anchor="middle">$(pwd)/html:/usr/share/…</text>
  <text x="400" y="210" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">✓ Real-time code changes</text>
  <text x="400" y="232" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">✓ Direct host access</text>
  <text x="400" y="254" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">✗ Not portable</text>
  <text x="400" y="285" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">Best for development</text>

  <!-- TMPFS -->
  <rect x="540" y="72" width="220" height="230" rx="10" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
  <rect x="540" y="72" width="220" height="36" rx="10" fill="#21262d"/>
  <rect x="540" y="93" width="220" height="15" fill="#21262d"/>
  <text x="650" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#f78166" text-anchor="middle">tmpfs Mount</text>
  <text x="650" y="138" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">In-memory only · Linux</text>
  <rect x="565" y="152" width="170" height="28" rx="5" fill="#f78166" opacity="0.15"/>
  <text x="650" y="170" font-family="'Courier New', monospace" font-size="11" fill="#f78166" text-anchor="middle">--tmpfs /tmp</text>
  <text x="650" y="210" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">✓ Extremely fast I/O</text>
  <text x="650" y="232" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">✓ Never touches disk</text>
  <text x="650" y="254" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">✗ Lost on container stop</text>
  <text x="650" y="285" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">Best for secrets / temp files</text>

  <!-- Container row -->
  <rect x="40" y="330" width="720" height="48" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="358" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">Container (ephemeral by default — data lost on removal)</text>

  <!-- Arrows up -->
  <path d="M150 330 L150 302" stroke="#2496ed" stroke-width="1.5" marker-end="url(#arr5)"/>
  <path d="M400 330 L400 302" stroke="#a371f7" stroke-width="1.5" marker-end="url(#arr5)"/>
  <path d="M650 330 L650 302" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr5)"/>

  <text x="400" y="410" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Getting Started with Docker Series · Part 5</text>
</svg>
