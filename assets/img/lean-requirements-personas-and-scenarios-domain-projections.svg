<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">One Domain Model, Many Projections</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#57606a">The same entities, mapped to storage, APIs, commands, and screens</text>

  <!-- Requirements -->
  <rect x="24" y="152" width="140" height="76" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text x="94" y="182" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#0969da">requirements.md</text>
  <text x="94" y="202" text-anchor="middle" font-size="10.5" fill="#57606a">nouns and verbs</text>
  <text x="94" y="216" text-anchor="middle" font-size="10.5" fill="#57606a">of the job stories</text>

  <line x1="166" y1="190" x2="204" y2="190" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Domain model -->
  <rect x="210" y="100" width="210" height="180" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
  <text x="315" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#8250df">Domain model</text>
  <text x="315" y="140" text-anchor="middle" font-size="10.5" fill="#57606a">technology-independent</text>
  <rect x="236" y="152" width="158" height="30" rx="6" fill="#ffffff" stroke="#8250df"/>
  <text x="315" y="172" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="700" fill="#1f2328">Link (aggregate)</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#1f2328" text-anchor="middle">
    <rect x="228" y="194" width="84" height="24" rx="5" fill="#ffffff" stroke="#c297ff"/>
    <text x="270" y="210">ShortCode</text>
    <rect x="318" y="194" width="84" height="24" rx="5" fill="#ffffff" stroke="#c297ff"/>
    <text x="360" y="210">TargetUrl</text>
    <rect x="228" y="226" width="84" height="24" rx="5" fill="#ffffff" stroke="#c297ff"/>
    <text x="270" y="242" font-size="9.5">Inspection</text>
    <rect x="318" y="226" width="84" height="24" rx="5" fill="#ffffff" stroke="#c297ff"/>
    <text x="360" y="242">Metrics</text>
  </g>
  <text x="315" y="268" text-anchor="middle" font-size="10" fill="#57606a">entities · value objects · relations</text>

  <!-- Arrows to projections -->
  <g stroke="#57606a" stroke-width="1.4" fill="none">
    <path d="M422 150 C450 150 450 98 478 98" marker-end="url(#arrow)"/>
    <path d="M422 176 C450 176 450 164 478 164" marker-end="url(#arrow)"/>
    <path d="M422 204 C450 204 450 230 478 230" marker-end="url(#arrow)"/>
    <path d="M422 230 C450 230 450 296 478 296" marker-end="url(#arrow)"/>
  </g>

  <!-- Projections -->
  <g>
    <rect x="484" y="72" width="252" height="54" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/>
    <text x="498" y="94" font-size="12.5" font-weight="700" fill="#1a7f37">Database</text>
    <text x="498" y="113" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#1f2328">logical ER → links table</text>

    <rect x="484" y="138" width="252" height="54" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/>
    <text x="498" y="160" font-size="12.5" font-weight="700" fill="#1a7f37">REST API</text>
    <text x="498" y="179" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#1f2328">/api/v1/links/{code}</text>

    <rect x="484" y="204" width="252" height="54" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="498" y="226" font-size="12.5" font-weight="700" fill="#57606a">Command line</text>
    <text x="498" y="245" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#57606a">links create · links inspect</text>

    <rect x="484" y="270" width="252" height="54" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="498" y="292" font-size="12.5" font-weight="700" fill="#57606a">User interface</text>
    <text x="498" y="311" font-size="10.5" fill="#57606a">list, detail, and create screens</text>
  </g>

  <!-- Legend -->
  <g font-size="10.5" fill="#57606a">
    <rect x="484" y="342" width="14" height="10" rx="2" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="504" y="351">implemented in FastURL</text>
    <rect x="624" y="342" width="14" height="10" rx="2" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="3 2"/>
    <text x="644" y="351">same model, other UIs</text>
  </g>
</svg>
