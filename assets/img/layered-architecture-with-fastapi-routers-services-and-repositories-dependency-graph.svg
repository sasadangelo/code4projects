<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#57606a"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="760" height="410" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#1f2328">FastURL Dependency Graph</text>
  <text x="380" y="48" text-anchor="middle" class="sans" font-size="11" fill="#57606a">What FastAPI builds, leaves first, for every POST /api/v1/links request</text>

  <!-- Column captions -->
  <text x="102" y="76" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#57606a" letter-spacing="1">LEAF RESOURCES</text>
  <text x="297" y="76" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#57606a" letter-spacing="1">REPOSITORY</text>
  <text x="502" y="76" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#57606a" letter-spacing="1">SERVICE</text>
  <text x="684" y="76" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#57606a" letter-spacing="1">ROUTER</text>

  <!-- get_db() -->
  <rect x="20" y="88" width="165" height="64" rx="8" fill="#f7f8fa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="105" y="114" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#1f2328">get_db()</text>
  <text x="105" y="133" text-anchor="middle" class="sans" font-size="10.5" fill="#57606a">yields an AsyncSession</text>

  <!-- get_http_client() -->
  <rect x="20" y="208" width="165" height="64" rx="8" fill="#f7f8fa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="105" y="234" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#1f2328">get_http_client()</text>
  <text x="105" y="253" text-anchor="middle" class="sans" font-size="10.5" fill="#57606a">reads app.state.http_client</text>

  <!-- _get_link_repository() -->
  <rect x="215" y="88" width="165" height="64" rx="8" fill="#f7f8fa" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="300" y="114" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#1f2328">_get_link_repository()</text>
  <text x="300" y="133" text-anchor="middle" class="sans" font-size="10.5" fill="#57606a">LinkRepository(session)</text>

  <!-- _get_link_service() -->
  <rect x="405" y="92" width="195" height="176" rx="8" fill="#f7f8fa" stroke="#7c5cd8" stroke-width="1.5"/>
  <text x="505" y="114" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#1f2328">_get_link_service()</text>

  <rect x="421" y="126" width="168" height="40" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="505" y="143" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#7c5cd8">InspectorService</text>
  <text x="505" y="158" text-anchor="middle" class="sans" font-size="10" fill="#57606a">built with http_client</text>

  <line x1="505" y1="166" x2="505" y2="182" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="421" y="186" width="168" height="40" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="505" y="203" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#7c5cd8">LinkService</text>
  <text x="505" y="218" text-anchor="middle" class="sans" font-size="10" fill="#57606a">repository + inspector</text>

  <text x="505" y="252" text-anchor="middle" class="sans" font-size="10" fill="#57606a">returns the LinkService</text>

  <!-- create_link() -->
  <rect x="628" y="148" width="112" height="64" rx="8" fill="#1f2328"/>
  <text x="684" y="174" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#ffffff">create_link()</text>
  <text x="684" y="193" text-anchor="middle" class="mono" font-size="9.5" fill="#d1d5db">LinkServiceDep</text>

  <!-- Arrows -->
  <line x1="185" y1="120" x2="213" y2="120" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="120" x2="403" y2="120" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M185,240 L395,240 L395,146 L419,146" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="290" y="233" text-anchor="middle" class="mono" font-size="10" fill="#57606a">httpx.AsyncClient</text>
  <line x1="600" y1="180" x2="626" y2="180" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Resolution rules -->
  <rect x="20" y="300" width="230" height="88" rx="8" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="36" y="324" class="sans" font-size="12" font-weight="700" fill="#1f2328">1 · Leaves first</text>
  <text x="36" y="344" class="sans" font-size="10.5" fill="#57606a">A dependency is always built before</text>
  <text x="36" y="359" class="sans" font-size="10.5" fill="#57606a">the function that needs it.</text>

  <rect x="265" y="300" width="230" height="88" rx="8" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="281" y="324" class="sans" font-size="12" font-weight="700" fill="#1f2328">2 · One instance per request</text>
  <text x="281" y="344" class="sans" font-size="10.5" fill="#57606a">get_db runs once per request, even if</text>
  <text x="281" y="359" class="sans" font-size="10.5" fill="#57606a">several nodes ask for DBSessionDep.</text>

  <rect x="510" y="300" width="230" height="88" rx="8" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="526" y="324" class="sans" font-size="12" font-weight="700" fill="#1f2328">3 · Cleanup at the end</text>
  <text x="526" y="344" class="sans" font-size="10.5" fill="#57606a">The code after yield in get_db runs</text>
  <text x="526" y="359" class="sans" font-size="10.5" fill="#57606a">after the response and after the</text>
  <text x="526" y="374" class="sans" font-size="10.5" fill="#57606a">background tasks.</text>
</svg>
