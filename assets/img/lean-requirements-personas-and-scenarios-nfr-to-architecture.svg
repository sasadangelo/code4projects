<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="760" height="320" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">From Two Requirements to an Architecture</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#57606a">How FastURL's constraints and NFRs shaped its design</text>

  <!-- Column labels -->
  <g font-size="11" font-weight="700" fill="#57606a">
    <text x="24" y="80">REQUIREMENTS</text>
    <text x="290" y="80">WHAT THEY IMPLY</text>
    <text x="510" y="80">ARCHITECTURE</text>
  </g>

  <!-- Requirements -->
  <rect x="24" y="92" width="236" height="84" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="38" y="114" font-size="10.5" font-weight="700" fill="#0969da">BUSINESS CONSTRAINT 4</text>
  <text x="38" y="134" font-size="12" fill="#1f2328">Link creation must respond</text>
  <text x="38" y="151" font-size="12" fill="#1f2328">without waiting for the</text>
  <text x="38" y="168" font-size="12" fill="#1f2328">inspection to finish</text>

  <rect x="24" y="192" width="236" height="84" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="38" y="214" font-size="10.5" font-weight="700" fill="#0969da">NON-FUNCTIONAL · PERFORMANCE</text>
  <text x="38" y="234" font-size="12" fill="#1f2328">Redirect and CRUD responses</text>
  <text x="38" y="251" font-size="12" fill="#1f2328">under 50 ms at the</text>
  <text x="38" y="268" font-size="12" fill="#1f2328">95th percentile</text>

  <!-- Implications -->
  <rect x="290" y="112" width="190" height="64" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="1.4"/>
  <text x="385" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">Background work</text>
  <text x="385" y="158" text-anchor="middle" font-size="11" fill="#57606a">outside the request</text>

  <rect x="290" y="192" width="190" height="64" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="1.4"/>
  <text x="385" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">Non-blocking I/O</text>
  <text x="385" y="238" text-anchor="middle" font-size="11" fill="#57606a">no thread waits on the network</text>

  <!-- Arrows -->
  <g stroke="#57606a" stroke-width="1.4" fill="none">
    <line x1="262" y1="140" x2="286" y2="142" marker-end="url(#arrow)"/>
    <line x1="262" y1="234" x2="286" y2="226" marker-end="url(#arrow)"/>
    <path d="M482 144 C496 144 494 170 506 170" marker-end="url(#arrow)"/>
    <path d="M482 224 C496 224 494 200 506 200" marker-end="url(#arrow)"/>
  </g>

  <!-- Architecture -->
  <rect x="510" y="92" width="226" height="184" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="623" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a7f37">Async FastAPI, layered</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="11" text-anchor="middle" fill="#1f2328">
    <rect x="530" y="128" width="186" height="26" rx="5" fill="#ffffff" stroke="#1a7f37"/>
    <text x="623" y="145">routers</text>
    <rect x="530" y="160" width="186" height="26" rx="5" fill="#ffffff" stroke="#1a7f37"/>
    <text x="623" y="177">services</text>
    <rect x="530" y="192" width="186" height="26" rx="5" fill="#ffffff" stroke="#1a7f37"/>
    <text x="623" y="209">repositories</text>
  </g>
  <rect x="530" y="230" width="186" height="34" rx="5" fill="#fff8c5" stroke="#bf8700"/>
  <text x="623" y="244" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#1f2328">BackgroundTasks</text>
  <text x="623" y="258" text-anchor="middle" font-size="10" fill="#57606a">link inspection</text>

  <text x="380" y="304" text-anchor="middle" font-size="11" fill="#57606a">Different requirements would point to hexagonal, clean, or event-driven architecture.</text>
</svg>
