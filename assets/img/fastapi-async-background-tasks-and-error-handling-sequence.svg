<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <defs>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#1f2328"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#3b82d4"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#7c5cd8"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#10b981"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <rect width="760" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2328">Background Task Sequence — Fire and Forget</text>
  <text x="380" y="50" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#57606a">Response is returned before inspection begins</text>

  <!-- ── Participant headers ── -->
  <!-- Client -->
  <rect x="30" y="66" width="100" height="30" rx="6" fill="#1f2328"/>
  <text x="80" y="86" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">Client</text>

  <!-- Router -->
  <rect x="185" y="66" width="110" height="30" rx="6" fill="#0ea5e9"/>
  <text x="240" y="86" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">Router</text>

  <!-- LinkService -->
  <rect x="345" y="66" width="110" height="30" rx="6" fill="#7c5cd8"/>
  <text x="400" y="86" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">LinkService</text>

  <!-- BackgroundTasks -->
  <rect x="493" y="66" width="110" height="30" rx="6" fill="#3b82d4"/>
  <text x="548" y="82" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff">Background</text>
  <text x="548" y="94" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff">Tasks</text>

  <!-- inspect_link -->
  <rect x="633" y="66" width="100" height="30" rx="6" fill="#10b981"/>
  <text x="683" y="82" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff">inspect_</text>
  <text x="683" y="94" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff">link()</text>

  <!-- Lifelines -->
  <line x1="80"  y1="96" x2="80"  y2="440" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="240" y1="96" x2="240" y2="440" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="400" y1="96" x2="400" y2="440" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="548" y1="96" x2="548" y2="440" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="683" y1="96" x2="683" y2="440" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ── Step 1: POST /api/v1/links ── -->
  <line x1="80" y1="126" x2="232" y2="126" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <rect x="88" y="112" width="136" height="18" rx="3" fill="#ffffff"/>
  <text x="156" y="124" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" font-weight="700" fill="#1f2328">POST /api/v1/links</text>

  <!-- ── Step 2: create_link() ── -->
  <line x1="240" y1="154" x2="392" y2="154" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <rect x="248" y="140" width="136" height="18" rx="3" fill="#ffffff"/>
  <text x="316" y="152" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#0ea5e9">await create_link()</text>

  <!-- ── Step 3: DB insert ── -->
  <rect x="392" y="168" width="16" height="36" rx="2" fill="#7c5cd8" opacity="0.3"/>
  <text x="418" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="10" fill="#57606a">INSERT INTO links</text>
  <text x="418" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="10" fill="#57606a">(async DB write)</text>

  <!-- ── Step 4: LinkResponse returned ── -->
  <line x1="392" y1="218" x2="248" y2="218" stroke="#7c5cd8" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-purple)"/>
  <rect x="248" y="204" width="136" height="18" rx="3" fill="#ffffff"/>
  <text x="316" y="216" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#7c5cd8">LinkResponse</text>

  <!-- ── Step 5: add_task() ── -->
  <line x1="240" y1="244" x2="540" y2="244" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="280" y="230" width="222" height="18" rx="3" fill="#ffffff"/>
  <text x="391" y="242" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#3b82d4">background_tasks.add_task(inspect_link)</text>

  <!-- ── Step 6: 201 Created → Client ── -->
  <rect x="220" y="258" width="40" height="46" rx="3" fill="#10b981" opacity="0.15"/>
  <line x1="240" y1="280" x2="88" y2="280" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-green)"/>
  <rect x="88" y="266" width="148" height="18" rx="3" fill="#ffffff"/>
  <text x="162" y="278" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" font-weight="700" fill="#10b981">201 Created  ← response sent</text>

  <!-- divider: after response -->
  <line x1="30" y1="300" x2="730" y2="300" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="380" y="314" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="10" fill="#57606a">— after response is sent —</text>

  <!-- ── Step 7: Starlette runs background task ── -->
  <line x1="548" y1="330" x2="675" y2="330" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="556" y="316" width="110" height="18" rx="3" fill="#ffffff"/>
  <text x="611" y="328" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#3b82d4">await inspect_link()</text>

  <!-- ── Step 8: inspect_link work ── -->
  <rect x="675" y="344" width="16" height="56" rx="2" fill="#10b981" opacity="0.3"/>
  <text x="520" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="10" fill="#57606a">HTTP GET target URL</text>
  <text x="520" y="373" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="10" fill="#57606a">extract title / description</text>
  <text x="520" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="10" fill="#57606a">UPDATE links SET status=…</text>

  <!-- endpoint circles on lifelines -->
  <circle cx="80"  cy="440" r="5" fill="#1f2328"/>
  <circle cx="240" cy="440" r="5" fill="#0ea5e9"/>
  <circle cx="400" cy="440" r="5" fill="#7c5cd8"/>
  <circle cx="548" cy="440" r="5" fill="#3b82d4"/>
  <circle cx="683" cy="440" r="5" fill="#10b981"/>
</svg>
