<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .tag-label { font-size: 13px; font-weight: 700; }
      .desc { font-size: 11px; fill: #57606a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    </style>
  </defs>

  <rect width="760" height="340" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="26" text-anchor="middle" class="title">HTML5 Semantic Tags — Page Structure</text>

  <!-- ===== BEFORE (plain divs) ===== -->
  <text x="190" y="52" text-anchor="middle" font-size="12" font-weight="600" fill="#57606a">Before: generic &lt;div&gt; elements</text>
  <!-- outer box -->
  <rect x="40" y="62" width="300" height="252" rx="6" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- div header -->
  <rect x="52" y="74" width="276" height="46" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="90" y="101" class="mono" fill="#ef4444">&lt;div id="header"&gt;</text>
  <!-- div nav -->
  <rect x="52" y="128" width="276" height="28" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="90" y="146" class="mono" fill="#ef4444">&lt;div id="nav"&gt;</text>
  <!-- div main -->
  <rect x="52" y="164" width="276" height="88" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="90" y="212" class="mono" fill="#ef4444">&lt;div id="main"&gt;</text>
  <!-- div footer -->
  <rect x="52" y="260" width="276" height="42" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="90" y="285" class="mono" fill="#ef4444">&lt;div id="footer"&gt;</text>

  <!-- ===== ARROW ===== -->
  <line x1="356" y1="188" x2="402" y2="188" stroke="#e5e7eb" stroke-width="2"/>
  <polygon points="402,183 412,188 402,193" fill="#e5e7eb"/>
  <text x="380" y="202" text-anchor="middle" font-size="10" fill="#57606a">HTML5</text>

  <!-- ===== AFTER (semantic tags) ===== -->
  <text x="570" y="52" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">After: semantic elements</text>
  <!-- outer box -->
  <rect x="420" y="62" width="300" height="252" rx="6" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- header -->
  <rect x="432" y="74" width="276" height="46" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="470" y="95" class="mono tag-label" fill="#3b82d4">&lt;header&gt;</text>
  <text x="470" y="111" class="desc">Logo + social icons — top of every page</text>

  <!-- nav -->
  <rect x="432" y="128" width="276" height="28" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="470" y="146" class="mono tag-label" fill="#6366f1">&lt;nav&gt;</text>

  <!-- main -->
  <rect x="432" y="164" width="276" height="88" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
  <text x="470" y="185" class="mono tag-label" fill="#10b981">&lt;main&gt;</text>
  <text x="470" y="203" class="desc">Page content — hero, features,</text>
  <text x="470" y="218" class="desc">articles, forms…</text>
  <text x="470" y="242" class="desc">max-width: 1080px; margin: auto;</text>

  <!-- footer -->
  <rect x="432" y="260" width="276" height="42" rx="4" fill="#f3e8ff" stroke="#7c5cd8" stroke-width="1.5"/>
  <text x="470" y="279" class="mono tag-label" fill="#7c5cd8">&lt;footer&gt;</text>
  <text x="470" y="295" class="desc">Social icons + copyright — bottom of every page</text>

  <!-- Bottom note -->
  <text x="380" y="328" text-anchor="middle" font-size="10" fill="#57606a">Semantic tags tell browsers, search engines, and screen readers the role of each region.</text>
</svg>
