<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg2)" rx="12"/>

  <!-- VM Stack (left) -->
  <text x="170" y="50" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="middle">Virtual Machine</text>

  <rect x="40" y="65" width="260" height="36" rx="5" fill="#388bfd" opacity="0.8"/>
  <text x="170" y="88" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">App A</text>

  <rect x="40" y="107" width="260" height="36" rx="5" fill="#388bfd" opacity="0.6"/>
  <text x="170" y="130" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Bins / Libs</text>

  <rect x="40" y="149" width="260" height="36" rx="5" fill="#388bfd" opacity="0.4"/>
  <text x="170" y="172" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Guest OS</text>

  <rect x="40" y="191" width="260" height="36" rx="5" fill="#f78166" opacity="0.8"/>
  <text x="170" y="214" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Hypervisor</text>

  <rect x="40" y="233" width="260" height="36" rx="5" fill="#7ee787" opacity="0.6"/>
  <text x="170" y="256" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#0d1117" text-anchor="middle">Host OS</text>

  <rect x="40" y="275" width="260" height="36" rx="5" fill="#7ee787" opacity="0.4"/>
  <text x="170" y="298" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#0d1117" text-anchor="middle">Hardware</text>

  <!-- Labels -->
  <text x="170" y="345" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#f78166" text-anchor="middle">Each VM = full OS copy</text>
  <text x="170" y="365" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">GBs · minutes to boot</text>

  <!-- Divider -->
  <line x1="400" y1="30" x2="400" y2="390" stroke="#30363d" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Container Stack (right) -->
  <text x="600" y="50" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="middle">Container</text>

  <rect x="470" y="65" width="115" height="36" rx="5" fill="#388bfd" opacity="0.8"/>
  <text x="527" y="88" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">App A</text>

  <rect x="470" y="107" width="115" height="36" rx="5" fill="#388bfd" opacity="0.6"/>
  <text x="527" y="130" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Libs</text>

  <rect x="595" y="65" width="115" height="36" rx="5" fill="#a371f7" opacity="0.8"/>
  <text x="652" y="88" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">App B</text>

  <rect x="595" y="107" width="115" height="36" rx="5" fill="#a371f7" opacity="0.6"/>
  <text x="652" y="130" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Libs</text>

  <rect x="470" y="155" width="240" height="36" rx="5" fill="#f78166" opacity="0.7"/>
  <text x="590" y="178" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Container Runtime (Docker)</text>

  <rect x="470" y="197" width="240" height="36" rx="5" fill="#7ee787" opacity="0.6"/>
  <text x="590" y="220" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#0d1117" text-anchor="middle">Host OS (shared kernel)</text>

  <rect x="470" y="239" width="240" height="36" rx="5" fill="#7ee787" opacity="0.4"/>
  <text x="590" y="262" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#0d1117" text-anchor="middle">Hardware</text>

  <text x="590" y="345" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#7ee787" text-anchor="middle">Shared kernel · no Guest OS</text>
  <text x="590" y="365" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">MBs · milliseconds to start</text>

  <!-- Bottom -->
  <line x1="40" y1="390" x2="760" y2="390" stroke="#388bfd" stroke-width="1" opacity="0.3"/>
  <text x="400" y="410" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Getting Started with Docker Series · Part 2</text>
</svg>
