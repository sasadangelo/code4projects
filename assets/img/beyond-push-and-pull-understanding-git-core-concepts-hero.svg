<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a44"/>
      <stop offset="0.55" stop-color="#0d2f78"/>
      <stop offset="1" stop-color="#0a1a44"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16346f"/>
      <stop offset="1" stop-color="#0c2154"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="tip" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="tipA" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="400" fill="url(#bg)"/>
  <rect width="760" height="400" fill="url(#halo)"/>

  <!-- Circuit decoration -->
  <g stroke="#3b82f6" stroke-opacity="0.18" stroke-width="1" fill="none">
    <path d="M0 105 H40 L60 85 H130"/>
    <path d="M760 105 H720 L700 85 H630"/>
    <path d="M0 375 H30 L50 355 H90"/>
    <path d="M760 375 H730 L710 355 H670"/>
  </g>
  <g fill="#60a5fa" fill-opacity="0.5">
    <circle cx="130" cy="85" r="2"/><circle cx="630" cy="85" r="2"/>
    <circle cx="90" cy="355" r="2"/><circle cx="670" cy="355" r="2"/>
  </g>

  <!-- Title -->
  <text x="380" y="48" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="27" font-weight="800" fill="#ffffff" filter="url(#softglow)">Beyond Push and Pull</text>
  <text x="380" y="76" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="15" fill="#bfd6ff">Understanding Git's Core Concepts to Avoid Common Pitfalls</text>

  <!-- Local machine frame -->
  <rect x="24" y="118" width="560" height="232" rx="14" fill="none" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="40" y="340" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#93c5fd" fill-opacity="0.8">local machine</text>

  <!-- Area boxes -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="44" y="150" width="120" height="64" rx="10" fill="url(#panel)" stroke="#f43f5e" stroke-width="2" filter="url(#glow)"/>
    <text x="104" y="187" fill="#fecdd3">Workspace</text>

    <rect x="228" y="150" width="120" height="64" rx="10" fill="url(#panel)" stroke="#a3e635" stroke-width="2" filter="url(#glow)"/>
    <text x="288" y="180" fill="#d9f99d">Staging</text>
    <text x="288" y="198" fill="#d9f99d">Area</text>

    <rect x="412" y="150" width="150" height="64" rx="10" fill="url(#panel)" stroke="#f87171" stroke-width="2" filter="url(#glow)"/>
    <text x="487" y="180" fill="#fecaca">Local Repo</text>
    <text x="487" y="198" font-size="11" font-weight="400" fill="#fca5a5" font-family="ui-monospace,Menlo,monospace">HEAD → main</text>

    <rect x="44" y="266" width="120" height="56" rx="10" fill="url(#panel)" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/>
    <text x="104" y="299" fill="#ddd6fe">Stash</text>

    <rect x="412" y="266" width="150" height="56" rx="10" fill="url(#panel)" stroke="#c084fc" stroke-width="2" filter="url(#glow)"/>
    <text x="487" y="290" fill="#e9d5ff">Remote Refs</text>
    <text x="487" y="307" font-size="11" font-weight="400" fill="#d8b4fe" font-family="ui-monospace,Menlo,monospace">origin/main</text>

    <rect x="622" y="200" width="118" height="72" rx="10" fill="url(#panel)" stroke="#fbbf24" stroke-width="2" filter="url(#glow)"/>
    <text x="681" y="232" fill="#fde68a">origin</text>
    <text x="681" y="252" font-size="11" font-weight="400" fill="#fcd34d">remote repo</text>
  </g>

  <!-- Arrows -->
  <g fill="none" stroke-width="2">
    <path d="M166 172 H222" stroke="#38bdf8" marker-end="url(#tip)"/>
    <path d="M350 172 H406" stroke="#38bdf8" marker-end="url(#tip)"/>
    <path d="M104 216 V260" stroke="#38bdf8" marker-end="url(#tip)"/>
    <path d="M564 182 C600 182 600 220 616 226" stroke="#fbbf24" marker-end="url(#tipA)"/>
    <path d="M620 256 C600 270 590 290 568 292" stroke="#fbbf24" marker-end="url(#tipA)"/>
    <path d="M487 262 V220" stroke="#38bdf8" marker-end="url(#tip)"/>
    <path d="M410 200 C320 240 220 240 170 202" stroke="#38bdf8" stroke-dasharray="5 4" marker-end="url(#tip)"/>
  </g>

  <!-- Command labels -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#bae6fd" text-anchor="middle">
    <text x="194" y="164">add</text>
    <text x="378" y="164">commit</text>
    <text x="124" y="244" text-anchor="start">stash</text>
    <text x="606" y="172" fill="#fde68a">push</text>
    <text x="604" y="306" fill="#fde68a">fetch</text>
    <text x="512" y="246" text-anchor="start">merge</text>
    <text x="290" y="252">checkout / restore</text>
  </g>
</svg>
