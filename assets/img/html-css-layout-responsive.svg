<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title  { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .bp     { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .bplabel{ font-size: 11px; font-weight: 700; fill: #1f2328; }
      .sub    { font-size: 10px; fill: #57606a; }
      .nav-item { font-size: 8px; font-weight: 700; fill: #f2f2f2; }
      .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; }
    </style>
    <marker id="arr2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d1d5db"/>
    </marker>
  </defs>

  <rect width="760" height="360" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="24" text-anchor="middle" class="title">Responsive Layout — Four Breakpoints</text>

  <!-- ── Breakpoint labels ───────────────────────────── -->
  <!-- Mobile -->
  <rect x="30"  y="36" width="90"  height="16" rx="8" fill="#ef4444"/>
  <text x="75"  y="48" text-anchor="middle" class="bp">≤ 479 px</text>
  <text x="75"  y="66" text-anchor="middle" class="bplabel">Mobile</text>

  <!-- Tablet -->
  <rect x="210" y="36" width="120" height="16" rx="8" fill="#f59e0b"/>
  <text x="270" y="48" text-anchor="middle" class="bp">480 – 767 px</text>
  <text x="270" y="66" text-anchor="middle" class="bplabel">Tablet / iPad</text>

  <!-- Laptop -->
  <rect x="420" y="36" width="130" height="16" rx="8" fill="#3b82d4"/>
  <text x="485" y="48" text-anchor="middle" class="bp">768 – 1023 px</text>
  <text x="485" y="66" text-anchor="middle" class="bplabel">Laptop</text>

  <!-- Desktop -->
  <rect x="640" y="36" width="90"  height="16" rx="8" fill="#10b981"/>
  <text x="685" y="48" text-anchor="middle" class="bp">≥ 1024 px</text>
  <text x="685" y="66" text-anchor="middle" class="bplabel">Desktop</text>

  <!-- ── MOBILE device ───────────────────────────────── -->
  <!-- phone outline -->
  <rect x="42" y="78" width="66" height="120" rx="8" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- header: stacked -->
  <rect x="42" y="78"  width="66" height="28" rx="8" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1"/>
  <rect x="42" y="92"  width="66" height="14" fill="#fcfcfc"/>
  <!-- logo centered -->
  <rect x="54" y="82"  width="18" height="18" rx="2" fill="#e5e7eb"/>
  <!-- social icons stacked below logo -->
  <rect x="78" y="82"  width="10" height="10" rx="2" fill="#597ac7"/>
  <rect x="78" y="94"  width="10" height="10" rx="2" fill="#0070b4"/>
  <!-- hamburger nav bar -->
  <rect x="42" y="106" width="66" height="18" fill="#1d67b2"/>
  <!-- hamburger icon -->
  <rect x="48" y="110" width="14" height="2" rx="1" fill="#ffffff"/>
  <rect x="48" y="114" width="14" height="2" rx="1" fill="#ffffff"/>
  <rect x="48" y="118" width="14" height="2" rx="1" fill="#ffffff"/>
  <text x="75" y="120" text-anchor="middle" font-size="7" fill="#f2f2f2">☰ Menu</text>
  <!-- main -->
  <rect x="42" y="124" width="66" height="58" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="48" y="130" width="54" height="20" rx="2" fill="#e5e7eb"/>
  <rect x="48" y="156" width="54" height="10" rx="2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="48" y="170" width="54" height="10" rx="2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <!-- footer -->
  <rect x="42" y="182" width="66" height="16" rx="0" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1"/>
  <text x="75"  y="193" text-anchor="middle" font-size="7" fill="#57606a">© 2025</text>
  <!-- annotation -->
  <text x="75"  y="216" text-anchor="middle" class="sub">Header: stacked</text>
  <text x="75"  y="228" text-anchor="middle" class="sub">Nav: hamburger</text>

  <!-- ── TABLET device ───────────────────────────────── -->
  <rect x="200" y="78" width="140" height="120" rx="6" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- header: row logo + social side by side -->
  <rect x="200" y="78" width="140" height="30" rx="6" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1"/>
  <rect x="200" y="94" width="140" height="14" fill="#fcfcfc"/>
  <rect x="208" y="84" width="20" height="18" rx="2" fill="#e5e7eb"/>
  <rect x="298" y="84" width="10" height="10" rx="2" fill="#597ac7"/>
  <rect x="310" y="84" width="10" height="10" rx="2" fill="#5bbcec"/>
  <rect x="322" y="84" width="10" height="10" rx="2" fill="#0070b4"/>
  <!-- nav: horizontal, no hamburger -->
  <rect x="200" y="108" width="140" height="16" fill="#1d67b2"/>
  <text x="222" y="119" class="nav-item">Home</text>
  <text x="250" y="119" class="nav-item">P.2</text>
  <text x="272" y="119" class="nav-item">P.3</text>
  <text x="294" y="119" class="nav-item">P.4</text>
  <text x="316" y="119" class="nav-item">P.5</text>
  <!-- main -->
  <rect x="200" y="124" width="140" height="58" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="208" y="130" width="124" height="20" rx="2" fill="#e5e7eb"/>
  <rect x="208" y="156" width="58" height="18" rx="2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="274" y="156" width="58" height="18" rx="2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <!-- footer -->
  <rect x="200" y="182" width="140" height="16" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1"/>
  <text x="270" y="193" text-anchor="middle" font-size="7" fill="#57606a">© 2025</text>
  <!-- annotation -->
  <text x="270" y="216" text-anchor="middle" class="sub">Header: row</text>
  <text x="270" y="228" text-anchor="middle" class="sub">Nav: horizontal bar</text>

  <!-- ── LAPTOP device ────────────────────────────────── -->
  <rect x="410" y="78" width="150" height="120" rx="6" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- header -->
  <rect x="410" y="78" width="150" height="30" rx="6" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1"/>
  <rect x="410" y="94" width="150" height="14" fill="#fcfcfc"/>
  <rect x="418" y="83" width="22" height="20" rx="2" fill="#e5e7eb"/>
  <rect x="506" y="83" width="10" height="10" rx="2" fill="#597ac7"/>
  <rect x="519" y="83" width="10" height="10" rx="2" fill="#5bbcec"/>
  <rect x="532" y="83" width="10" height="10" rx="2" fill="#0070b4"/>
  <!-- nav -->
  <rect x="410" y="108" width="150" height="16" fill="#1d67b2"/>
  <text x="428" y="119" class="nav-item">Home</text>
  <text x="454" y="119" class="nav-item">P.2</text>
  <text x="476" y="119" class="nav-item">P.3</text>
  <text x="498" y="119" class="nav-item">P.4</text>
  <text x="520" y="119" class="nav-item">P.5</text>
  <!-- main with hero -->
  <rect x="410" y="124" width="150" height="58" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="418" y="130" width="134" height="22" rx="2" fill="#e5e7eb"/>
  <rect x="504" y="133" width="42" height="16" rx="6" fill="rgba(100,100,100,0.3)"/>
  <text x="525" y="144" text-anchor="middle" font-size="7" fill="#fff">Welcome</text>
  <rect x="418" y="158" width="40" height="18" rx="2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="464" y="158" width="40" height="18" rx="2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="510" y="158" width="40" height="18" rx="2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <!-- footer -->
  <rect x="410" y="182" width="150" height="16" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1"/>
  <text x="485" y="193" text-anchor="middle" font-size="7" fill="#57606a">© 2025</text>
  <!-- annotation -->
  <text x="485" y="216" text-anchor="middle" class="sub">Header: row</text>
  <text x="485" y="228" text-anchor="middle" class="sub">Full nav + features grid</text>

  <!-- ── DESKTOP device ───────────────────────────────── -->
  <rect x="630" y="78" width="100" height="120" rx="6" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- header wider -->
  <rect x="630" y="78" width="100" height="30" rx="6" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1"/>
  <rect x="630" y="94" width="100" height="14" fill="#fcfcfc"/>
  <rect x="636" y="82" width="18" height="20" rx="2" fill="#e5e7eb"/>
  <rect x="694" y="83" width="9" height="9" rx="2" fill="#597ac7"/>
  <rect x="705" y="83" width="9" height="9" rx="2" fill="#5bbcec"/>
  <rect x="716" y="83" width="9" height="9" rx="2" fill="#0070b4"/>
  <!-- nav -->
  <rect x="630" y="108" width="100" height="16" fill="#1d67b2"/>
  <text x="645" y="119" class="nav-item">Home</text>
  <text x="660" y="119" class="nav-item"> P.2</text>
  <text x="678" y="119" class="nav-item"> P.3</text>
  <text x="696" y="119" class="nav-item"> P.4</text>
  <text x="714" y="119" class="nav-item"> P.5</text>
  <!-- main with full hero + newsletter -->
  <rect x="630" y="124" width="100" height="38" fill="#e5e7eb" rx="2"/>
  <rect x="682" y="128" width="42" height="30" rx="4" fill="rgba(100,100,100,0.3)"/>
  <text x="703" y="146" text-anchor="middle" font-size="7" fill="#fff">Welcome!</text>
  <!-- newsletter section -->
  <rect x="630" y="162" width="100" height="20" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="634" y="165" width="24" height="14" rx="2" fill="#e5e7eb"/>
  <rect x="662" y="166" width="64" height="5" rx="2" fill="#d1d5db"/>
  <rect x="662" y="173" width="64" height="5" rx="2" fill="#d1d5db"/>
  <!-- footer -->
  <rect x="630" y="182" width="100" height="16" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1"/>
  <text x="680" y="193" text-anchor="middle" font-size="7" fill="#57606a">© 2025</text>
  <!-- annotation -->
  <text x="680" y="216" text-anchor="middle" class="sub">Full layout</text>
  <text x="680" y="228" text-anchor="middle" class="sub">Hero + newsletter</text>

  <!-- ── CSS code strip ─────────────────────────────── -->
  <rect x="30" y="248" width="700" height="96" rx="8" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="50" y="268" class="mono" fill="#57606a">/* Mobile-first approach */</text>
  <text x="50" y="284" class="mono" fill="#1f2328">#header-group {  flex-direction: <tspan fill="#ef4444">column</tspan>; }          <tspan fill="#57606a">/* default: mobile */</tspan></text>
  <text x="50" y="300" class="mono" fill="#1f2328">@media (min-width: <tspan fill="#f59e0b">480px</tspan>) { #header-group { flex-direction: <tspan fill="#3b82d4">row</tspan>; } }  <tspan fill="#57606a">/* tablet+ */</tspan></text>
  <text x="50" y="316" class="mono" fill="#1f2328">@media (max-width: <tspan fill="#ef4444">479px</tspan>) { nav ul { display: <tspan fill="#ef4444">none</tspan>; } .hamburger { display: <tspan fill="#10b981">block</tspan>; } }</text>
  <text x="50" y="332" class="mono" fill="#1f2328">.drop-menu-checkbox:checked ~ nav ul { display: <tspan fill="#10b981">block</tspan>; }    <tspan fill="#57606a">/* CSS-only toggle */</tspan></text>

  <!-- title bottom -->
  <text x="380" y="354" text-anchor="middle" font-size="10" fill="#57606a">No JavaScript required — the hamburger menu uses a hidden checkbox toggled via CSS sibling combinator (~).</text>
</svg>
