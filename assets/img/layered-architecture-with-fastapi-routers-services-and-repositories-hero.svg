<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title description">
  <title id="title">FastAPI layered architecture</title>
  <desc id="description">An HTTP request flows through router, service, and repository layers to a SQL database.</desc>
  <defs>
  </defs>
  <rect width="760" height="400" fill="#1d2b30"/>
  <path d="M724 0 760 36M724 400 760 364" stroke="#e9b953" stroke-opacity=".28" stroke-width="2"/>
  <path d="M34 35h38M34 43h22M34 51h30" stroke="#70d0bd" stroke-width="3" stroke-linecap="round"/>
  <text x="88" y="51" fill="#b8cbc4" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">FASTURL / FASTAPI</text>
  <text x="42" y="128" fill="#f3eee1" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="34" font-weight="700">Clear layers.</text>
  <text x="42" y="169" fill="#f3eee1" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="34" font-weight="700">Clean boundaries.</text>
  <text x="44" y="210" fill="#b8cbc4" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="15">One request, handled by focused</text>
  <text x="44" y="232" fill="#b8cbc4" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="15">components from HTTP to SQL.</text>
