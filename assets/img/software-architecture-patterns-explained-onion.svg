<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" width="760" height="492">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 Z" fill="#57606a"/></marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="760" height="492" fill="#ffffff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Onion Architecture: FastURL</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#57606a">Concentric rings; every ring depends only on the rings inside it</text>
  <circle cx="215" cy="265" r="175" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <circle cx="215" cy="265" r="128" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/>
  <circle cx="215" cy="265" r="84" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="215" cy="265" r="42" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="215" y="117.5" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">API · Infrastructure · Tests</text>
  <text x="215" y="163.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">Application services</text>
  <text x="215" y="206.0" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Domain services</text>
  <text x="215" y="259" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">Domain model</text>
  <text x="215" y="277" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#6d28d9">Link</text>
  <line x1="44" y1="265" x2="170" y2="265" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="104" y="258" font-size="9" fill="#57606a" text-anchor="middle">dependencies point inward</text>
  <rect x="420" y="82" width="320" height="70" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="434" y="102" text-anchor="start" font-size="11" font-weight="700" fill="#6d28d9">DOMAIN MODEL</text>
  <text x="434" y="120" font-size="10.5" fill="#1f2328" xml:space="preserve"><tspan font-family="ui-monospace,Menlo,monospace">Link</tspan> and its rules: active, expired</text>
  <text x="434" y="135" font-size="10.5" fill="#1f2328" xml:space="preserve">depends on nothing</text>
  <rect x="420" y="160" width="320" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="434" y="180" text-anchor="start" font-size="11" font-weight="700" fill="#b45309">DOMAIN SERVICES</text>
  <text x="434" y="198" font-size="10.5" fill="#1f2328" xml:space="preserve">short code generation</text>
  <text x="434" y="213" font-size="10.5" fill="#1f2328" xml:space="preserve"><tspan font-family="ui-monospace,Menlo,monospace">LinkRepository</tspan> interface</text>
  <rect x="420" y="238" width="320" height="70" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="434" y="258" text-anchor="start" font-size="11" font-weight="700" fill="#0f766e">APPLICATION SERVICES</text>
  <text x="434" y="276" font-size="10.5" fill="#1f2328" xml:space="preserve">create, resolve, delete a link</text>
  <text x="434" y="291" font-size="10.5" fill="#1f2328" xml:space="preserve">orchestration and transactions</text>
  <rect x="420" y="316" width="320" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="434" y="336" text-anchor="start" font-size="11" font-weight="700" fill="#1d4ed8">OUTER RING</text>
  <text x="434" y="354" font-size="10.5" fill="#1f2328" xml:space="preserve">FastAPI routers, SQLAlchemy repository,</text>
  <text x="434" y="369" font-size="10.5" fill="#1f2328" xml:space="preserve">httpx inspector, tests</text>
  <text x="380" y="466" text-anchor="middle" font-size="11" fill="#1f2328">Compared with hexagonal: the core is layered too, and Link sits alone at the center,</text>
  <text x="380" y="483" text-anchor="middle" font-size="11" fill="#1f2328">without even knowing that a repository exists.</text>
  </g>
</svg>
