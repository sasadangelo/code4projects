<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg)" rx="12"/>

  <!-- Series journey: from requirements to tested code -->
  <line x1="62" y1="70" x2="62" y2="310" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>

  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600">
    <rect x="40" y="46" width="240" height="48" rx="10" fill="#3776ab" opacity="0.25" stroke="#3776ab" stroke-width="2"/>
    <circle cx="62" cy="70" r="7" fill="#3776ab"/>
    <text x="82" y="77" fill="#ffffff">Requirements</text>

    <rect x="40" y="106" width="240" height="48" rx="10" fill="#3776ab" opacity="0.25" stroke="#3776ab" stroke-width="2"/>
    <circle cx="62" cy="130" r="7" fill="#3776ab"/>
    <text x="82" y="137" fill="#ffffff">Setup &amp; Config</text>

    <rect x="40" y="166" width="240" height="48" rx="10" fill="#6f9fb8" opacity="0.25" stroke="#6f9fb8" stroke-width="2"/>
    <circle cx="62" cy="190" r="7" fill="#6f9fb8"/>
    <text x="82" y="197" fill="#ffffff">Database &amp; Async</text>

    <rect x="40" y="226" width="240" height="48" rx="10" fill="#c9b96a" opacity="0.25" stroke="#c9b96a" stroke-width="2"/>
    <circle cx="62" cy="250" r="7" fill="#c9b96a"/>
    <text x="82" y="257" fill="#ffffff">CLI &amp; REST API</text>

    <rect x="40" y="286" width="240" height="48" rx="10" fill="#ffd43b" opacity="0.25" stroke="#ffd43b" stroke-width="2"/>
    <circle cx="62" cy="310" r="7" fill="#ffd43b"/>
    <text x="82" y="317" fill="#ffffff">Testing</text>
  </g>

  <!-- Title -->
  <text x="320" y="130" font-family="'Segoe UI', system-ui, sans-serif" font-size="40" font-weight="700" fill="#ffffff">How to Write</text>
  <text x="320" y="183" font-family="'Segoe UI', system-ui, sans-serif" font-size="40" font-weight="700" fill="#ffd43b">Modern Python</text>
  <text x="320" y="236" font-family="'Segoe UI', system-ui, sans-serif" font-size="40" font-weight="700" fill="#3776ab">Applications</text>

  <!-- Tags -->
  <rect x="320" y="266" width="130" height="34" rx="17" fill="#3776ab" opacity="0.25"/>
  <text x="385" y="288" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#7fb3e0" text-anchor="middle">architecture</text>

  <rect x="462" y="266" width="100" height="34" rx="17" fill="#3776ab" opacity="0.25"/>
  <text x="512" y="288" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#7fb3e0" text-anchor="middle">FastAPI</text>

  <rect x="574" y="266" width="90" height="34" rx="17" fill="#3776ab" opacity="0.25"/>
  <text x="619" y="288" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#7fb3e0" text-anchor="middle">pytest</text>

  <!-- Bottom line -->
  <line x1="320" y1="360" x2="740" y2="360" stroke="#ffd43b" stroke-width="2" opacity="0.4"/>
  <text x="320" y="385" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8b949e">From requirements to tested, production-grade code</text>
</svg>
