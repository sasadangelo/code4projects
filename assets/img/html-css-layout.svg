<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 15px; font-weight: 700; fill: #1f2328; }
      .label { font-size: 12px; font-weight: 600; fill: #ffffff; }
      .sublabel { font-size: 11px; fill: #57606a; }
      .tag { font-size: 10px; font-weight: 600; fill: #ffffff; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #57606a; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="760" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" class="title">Website Page Anatomy</text>
  <text x="380" y="47" text-anchor="middle" font-size="11" fill="#57606a">HTML5 semantic structure with CSS layout</text>

  <!-- Browser chrome -->
  <rect x="60" y="62" width="640" height="316" rx="8" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- Browser tab bar -->
  <rect x="60" y="62" width="640" height="24" rx="8" fill="#e5e7eb"/>
  <rect x="60" y="74" width="640" height="12" fill="#e5e7eb"/>
  <!-- Tab -->
  <rect x="76" y="65" width="110" height="18" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="131" y="77" text-anchor="middle" font-size="9" fill="#57606a">HTML Hero — Home</text>
  <!-- Address bar -->
  <rect x="200" y="67" width="260" height="14" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="330" y="78" text-anchor="middle" font-size="9" fill="#57606a">htmlhero.altervista.org</text>

  <!-- HEADER -->
  <rect x="60" y="86" width="640" height="68" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1"/>
  <!-- Logo placeholder -->
  <rect x="78" y="96" width="50" height="48" rx="4" fill="#e5e7eb"/>
  <text x="103" y="124" text-anchor="middle" font-size="9" fill="#57606a">LOGO</text>
  <!-- Social icons -->
  <rect x="560" y="104" width="26" height="26" rx="4" fill="#597ac7"/>
  <text x="573" y="121" text-anchor="middle" class="tag">f</text>
  <rect x="592" y="104" width="26" height="26" rx="4" fill="#5bbcec"/>
  <text x="605" y="121" text-anchor="middle" class="tag">t</text>
  <rect x="624" y="104" width="26" height="26" rx="4" fill="#0070b4"/>
  <text x="637" y="121" text-anchor="middle" class="tag">in</text>
  <text x="587" y="147" text-anchor="middle" font-size="9" fill="#57606a">Follow me on:</text>
  <!-- header tag badge -->
  <rect x="62" y="88" width="54" height="16" rx="3" fill="#3b82d4"/>
  <text x="89" y="100" text-anchor="middle" class="tag">&lt;header&gt;</text>

  <!-- NAV -->
  <rect x="60" y="154" width="640" height="32" fill="#1d67b2"/>
  <!-- Nav items -->
  <text x="134" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#f2f2f2">Home</text>
  <text x="234" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#f2f2f2">Second Page</text>
  <text x="354" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#f2f2f2">Third Page</text>
  <text x="474" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#f2f2f2">Fourth Page</text>
  <text x="594" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#f2f2f2">Fifth Page</text>
  <!-- nav badge -->
  <rect x="62" y="156" width="38" height="14" rx="3" fill="#2563eb"/>
  <text x="81" y="167" text-anchor="middle" class="tag">&lt;nav&gt;</text>

  <!-- MAIN content area -->
  <rect x="60" y="186" width="640" height="140" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Hero area mockup inside main -->
  <rect x="72" y="196" width="616" height="70" rx="4" fill="#e5e7eb"/>
  <text x="380" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#57606a">Hero Image</text>
  <rect x="480" y="205" width="120" height="45" rx="8" fill="rgba(100,100,100,0.35)"/>
  <text x="540" y="228" text-anchor="middle" font-size="10" fill="#ffffff">Welcome!</text>
  <!-- Feature rows -->
  <rect x="72" y="276" width="188" height="38" rx="4" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="166" y="299" text-anchor="middle" font-size="10" fill="#57606a">Feature 1</text>
  <rect x="276" y="276" width="188" height="38" rx="4" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="370" y="299" text-anchor="middle" font-size="10" fill="#57606a">Feature 2</text>
  <rect x="480" y="276" width="188" height="38" rx="4" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="574" y="299" text-anchor="middle" font-size="10" fill="#57606a">Feature 3</text>
  <!-- main badge -->
  <rect x="62" y="188" width="40" height="14" rx="3" fill="#10b981"/>
  <text x="82" y="199" text-anchor="middle" class="tag">&lt;main&gt;</text>

  <!-- FOOTER -->
  <rect x="60" y="326" width="640" height="52" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1"/>
  <!-- Footer social icons -->
  <rect x="300" y="334" width="22" height="22" rx="3" fill="#597ac7"/>
  <text x="311" y="349" text-anchor="middle" class="tag">f</text>
  <rect x="328" y="334" width="22" height="22" rx="3" fill="#5bbcec"/>
  <text x="339" y="349" text-anchor="middle" class="tag">t</text>
  <rect x="356" y="334" width="22" height="22" rx="3" fill="#0070b4"/>
  <text x="367" y="349" text-anchor="middle" class="tag">in</text>
  <text x="380" y="366" text-anchor="middle" font-size="9" fill="#57606a">Code4Projects © 2016-2025</text>
  <!-- footer badge -->
  <rect x="62" y="328" width="52" height="14" rx="3" fill="#7c5cd8"/>
  <text x="88" y="339" text-anchor="middle" class="tag">&lt;footer&gt;</text>

  <!-- Right-side annotations -->
  <!-- header arrow -->
  <line x1="706" y1="120" x2="730" y2="120" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="700" y="123" text-anchor="end" class="sublabel">header</text>
  <!-- nav arrow -->
  <line x1="706" y1="170" x2="730" y2="170" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="700" y="173" text-anchor="end" class="sublabel">nav</text>
  <!-- main arrow -->
  <line x1="706" y1="256" x2="730" y2="256" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="700" y="259" text-anchor="end" class="sublabel">main</text>
  <!-- footer arrow -->
  <line x1="706" y1="352" x2="730" y2="352" stroke="#7c5cd8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="700" y="355" text-anchor="end" class="sublabel">footer</text>

  <!-- default.css badge -->
  <rect x="180" y="374" width="88" height="18" rx="9" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="224" y="387" text-anchor="middle" font-size="10" fill="#3b82d4">default.css</text>
  <text x="224" y="396" text-anchor="middle" font-size="9" fill="#57606a">shared by all pages</text>
  <!-- home.css badge -->
  <rect x="470" y="374" width="76" height="18" rx="9" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="508" y="387" text-anchor="middle" font-size="10" fill="#7c5cd8">home.css</text>
  <text x="508" y="396" text-anchor="middle" font-size="9" fill="#57606a">home page only</text>

  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
