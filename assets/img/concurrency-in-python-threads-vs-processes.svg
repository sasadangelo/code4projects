<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, system-ui, sans-serif">

  <!-- Background -->
  <rect width="760" height="400" fill="#ffffff"/>

  <!-- ══ PROCESS A ══ -->
  <rect x="30" y="50" width="330" height="300" rx="8" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="195" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Process A</text>

  <!-- GIL badge -->
  <rect x="50" y="68" width="60" height="26" rx="5" fill="#3b82d4"/>
  <text x="80" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">GIL</text>

  <!-- Memory block -->
  <rect x="130" y="68" width="210" height="26" rx="5" fill="#e5e7eb"/>
  <text x="235" y="85" text-anchor="middle" font-size="11" fill="#57606a">Memory (heap, globals)</text>

  <!-- Threads inside Process A -->
  <rect x="50"  y="116" width="80" height="36" rx="5" fill="#3b82d4" opacity="0.85"/>
  <text x="90"  y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Thread 1</text>

  <rect x="150" y="116" width="80" height="36" rx="5" fill="#3b82d4" opacity="0.65"/>
  <text x="190" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Thread 2</text>

  <rect x="250" y="116" width="80" height="36" rx="5" fill="#3b82d4" opacity="0.45"/>
  <text x="290" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Thread 3</text>

  <!-- Shared memory arrow -->
  <line x1="90"  y1="152" x2="90"  y2="175" stroke="#3b82d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="190" y1="152" x2="190" y2="175" stroke="#3b82d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="290" y1="152" x2="290" y2="175" stroke="#3b82d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="50" y="175" width="280" height="28" rx="5" fill="#dbeafe"/>
  <text x="190" y="193" text-anchor="middle" font-size="11" fill="#1f2328">shared memory — no copy needed</text>

  <!-- GIL contention note -->
  <rect x="50" y="222" width="280" height="50" rx="5" fill="#fff3cd" stroke="#f0c040" stroke-width="1"/>
  <text x="190" y="242" text-anchor="middle" font-size="11" fill="#1f2328">Threads share the GIL.</text>
  <text x="190" y="258" text-anchor="middle" font-size="11" fill="#1f2328">Only one runs Python bytecode at a time.</text>

  <!-- Properties list Process A -->
  <text x="50" y="298" font-size="11" fill="#57606a">✓ Low startup cost</text>
  <text x="50" y="316" font-size="11" fill="#57606a">✓ Shared memory, no serialisation</text>
  <text x="50" y="334" font-size="11" fill="#e05252">✗ GIL limits CPU parallelism</text>

  <!-- ══ DIVIDER ══ -->
  <line x1="380" y1="20" x2="380" y2="380" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ══ PROCESS B ══ -->
  <rect x="400" y="50" width="145" height="230" rx="8" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="472" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Process B</text>

  <!-- GIL badge B -->
  <rect x="418" y="68" width="50" height="26" rx="5" fill="#7c5cd8"/>
  <text x="443" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">GIL</text>

  <!-- Memory block B -->
  <rect x="478" y="68" width="50" height="26" rx="5" fill="#e5e7eb"/>
  <text x="503" y="85" text-anchor="middle" font-size="10" fill="#57606a">Memory</text>

  <!-- Thread inside Process B -->
  <rect x="418" y="116" width="108" height="36" rx="5" fill="#7c5cd8" opacity="0.85"/>
  <text x="472" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Thread 1</text>

  <!-- Isolated memory note -->
  <rect x="418" y="175" width="108" height="28" rx="5" fill="#ede9fb"/>
  <text x="472" y="190" text-anchor="middle" font-size="10" fill="#1f2328">isolated memory</text>

  <!-- GIL note B -->
  <rect x="418" y="222" width="108" height="40" rx="5" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="472" y="239" text-anchor="middle" font-size="10" fill="#1f2328">Own GIL.</text>
  <text x="472" y="255" text-anchor="middle" font-size="10" fill="#1f2328">Runs in parallel.</text>

  <!-- ══ PROCESS C ══ -->
  <rect x="560" y="50" width="170" height="230" rx="8" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="645" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Process C</text>

  <!-- GIL badge C -->
  <rect x="578" y="68" width="50" height="26" rx="5" fill="#7c5cd8"/>
  <text x="603" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">GIL</text>

  <!-- Memory block C -->
  <rect x="638" y="68" width="72" height="26" rx="5" fill="#e5e7eb"/>
  <text x="674" y="85" text-anchor="middle" font-size="10" fill="#57606a">Memory</text>

  <!-- Threads inside Process C -->
  <rect x="578" y="116" width="70" height="36" rx="5" fill="#7c5cd8" opacity="0.85"/>
  <text x="613" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Thread 1</text>

  <rect x="658" y="116" width="52" height="36" rx="5" fill="#7c5cd8" opacity="0.6"/>
  <text x="684" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">T 2</text>

  <!-- Isolated memory note C -->
  <rect x="578" y="175" width="132" height="28" rx="5" fill="#ede9fb"/>
  <text x="644" y="190" text-anchor="middle" font-size="10" fill="#1f2328">isolated memory</text>

  <!-- GIL note C -->
  <rect x="578" y="222" width="132" height="40" rx="5" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="644" y="239" text-anchor="middle" font-size="10" fill="#1f2328">Own GIL.</text>
  <text x="644" y="255" text-anchor="middle" font-size="10" fill="#1f2328">Runs in parallel with B.</text>

  <!-- Properties list Processes B+C -->
  <text x="400" y="298" font-size="11" fill="#57606a">✓ True CPU parallelism</text>
  <text x="400" y="316" font-size="11" fill="#57606a">✓ Each process has its own GIL</text>
  <text x="400" y="334" font-size="11" fill="#e05252">✗ High startup cost, no shared memory</text>

  <!-- Bottom caption -->
  <text x="380" y="375" text-anchor="middle" font-size="11" fill="#57606a">Threads share memory and one GIL · Processes have isolated memory and independent GILs</text>

</svg>
