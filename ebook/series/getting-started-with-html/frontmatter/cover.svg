<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3ea"/>
      <stop offset="1" stop-color="#ffe1cc"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33206e"/>
      <stop offset="1" stop-color="#6a45c9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1536" fill="#ffffff"/>
  <rect x="0" y="0" width="1024" height="1536" fill="none" stroke="#4b2e9e" stroke-width="6"/>

  <!-- Author box -->
  <rect x="70" y="0" width="313" height="160" fill="#5a3bb5" stroke="#33206e" stroke-width="5"/>
  <text x="226" y="132" fill="#ffffff" font-size="28" font-weight="600" text-anchor="middle">Salvatore D’Angelo</text>

  <!-- Ebook badge -->
  <g transform="translate(905 64)" fill="none" stroke="#4b2e9e" stroke-width="4" stroke-linejoin="round">
    <path d="M0 6 Q14 0 28 6 V40 Q14 34 0 40 Z"/>
    <path d="M28 6 Q42 0 56 6 V40 Q42 34 28 40 Z"/>
  </g>
  <text x="933" y="132" fill="#4b2e9e" font-size="20" font-weight="700" text-anchor="middle">EBOOK</text>

  <!-- Title -->
  <text x="76" y="290" fill="#3b2a7a" font-size="58" font-weight="800">Build Your First</text>
  <text x="66" y="430" fill="#4b2e9e" font-size="160" font-weight="800" letter-spacing="-4">Website</text>
  <text x="76" y="505" fill="#f2672a" font-size="64" font-weight="800">with HTML &amp; CSS</text>

  <text x="76" y="560" fill="#2b2140" font-size="28">Step by step, from a blank page</text>
  <text x="76" y="596" fill="#2b2140" font-size="28">to a complete, responsive site</text>

  <!-- Diagonal band -->
  <polygon points="0,625 1024,690 1024,830 0,770" fill="url(#band)"/>

  <!-- HTML5 / CSS3 shields -->
  <g transform="translate(640 585)">
    <path d="M0 0 H150 L136 156 L75 176 L14 156 Z" fill="#e34f26"/>
    <path d="M75 12 H138 L126 146 L75 162 Z" fill="#ef652a"/>
    <path d="M38 40 H112 L110 62 H62 L64 84 H108 L102 134 L75 142 L48 134 L46 110 H68 L69 120 L75 122 L81 120 L83 104 H44 Z" fill="#ffffff"/>
    <text x="75" y="-12" fill="#e34f26" font-size="22" font-weight="800" text-anchor="middle">HTML5</text>
  </g>
  <g transform="translate(820 615)">
    <path d="M0 0 H130 L118 136 L65 152 L12 136 Z" fill="#1572b6"/>
    <path d="M65 10 H120 L109 126 L65 140 Z" fill="#33a9dc"/>
    <text x="65" y="118" fill="#ffffff" font-size="104" font-weight="800" text-anchor="middle">3</text>
    <text x="65" y="-12" fill="#1572b6" font-size="22" font-weight="800" text-anchor="middle">CSS3</text>
  </g>

  <!-- Lower scene -->
  <rect x="0" y="830" width="1024" height="440" fill="url(#sky)"/>
  <polygon points="0,770 1024,830 1024,840 0,780" fill="#ffb48a" opacity="0.6"/>

  <!-- Timeline -->
  <line x1="0" y1="900" x2="1024" y2="920" stroke="#4b2e9e" stroke-width="3"/>
  <circle cx="170" cy="903" r="7" fill="#4b2e9e"/>
  <circle cx="398" cy="907" r="13" fill="#ffffff" stroke="#4b2e9e" stroke-width="3"/>
  <circle cx="756" cy="914" r="13" fill="#ffffff" stroke="#4b2e9e" stroke-width="3"/>
  <circle cx="904" cy="917" r="7" fill="#4b2e9e"/>

  <!-- Code editor window -->
  <g transform="translate(110 960)">
    <rect width="420" height="270" rx="14" fill="#221545"/>
    <rect width="420" height="40" rx="14" fill="#33206e"/>
    <rect y="26" width="420" height="14" fill="#33206e"/>
    <circle cx="24" cy="20" r="7" fill="#ff5f57"/>
    <circle cx="48" cy="20" r="7" fill="#febc2e"/>
    <circle cx="72" cy="20" r="7" fill="#28c840"/>
    <text x="210" y="27" fill="#c9b8f0" font-size="16" text-anchor="middle">index.html</text>
    <g font-family="Menlo, Monaco, monospace" font-size="19">
      <text x="24" y="80" fill="#b9a2ff">&lt;!DOCTYPE html&gt;</text>
      <text x="24" y="110" fill="#b9a2ff">&lt;html&gt;</text>
      <text x="46" y="140" fill="#b9a2ff">&lt;body&gt;</text>
      <text x="68" y="170"><tspan fill="#ff9f7a">&lt;h1&gt;</tspan><tspan fill="#ffffff">Hello!</tspan><tspan fill="#ff9f7a">&lt;/h1&gt;</tspan></text>
      <text x="68" y="200"><tspan fill="#ff9f7a">&lt;nav&gt;</tspan><tspan fill="#ffffff">…</tspan><tspan fill="#ff9f7a">&lt;/nav&gt;</tspan></text>
      <text x="46" y="230" fill="#b9a2ff">&lt;/body&gt;</text>
      <text x="24" y="258" fill="#b9a2ff">&lt;/html&gt;</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M552 1095 H600" stroke="#4b2e9e" stroke-width="5" stroke-linecap="round"/>
  <path d="M592 1083 L610 1095 L592 1107" fill="none" stroke="#4b2e9e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Browser window with rendered site -->
  <g transform="translate(630 960)">
    <rect width="300" height="270" rx="14" fill="#ffffff" stroke="#4b2e9e" stroke-width="3"/>
    <rect x="1.5" y="1.5" width="297" height="36" rx="12" fill="#f3edff"/>
    <rect x="60" y="11" width="220" height="16" rx="8" fill="#ffffff"/>
    <circle cx="20" cy="19" r="5" fill="#ffb48a"/>
    <circle cx="38" cy="19" r="5" fill="#ffb48a"/>
    <rect x="16" y="50" width="40" height="26" rx="4" fill="#ffe1cc"/>
    <rect x="224" y="56" width="16" height="16" rx="3" fill="#4b2e9e"/>
    <rect x="246" y="56" width="16" height="16" rx="3" fill="#33a9dc"/>
    <rect x="268" y="56" width="16" height="16" rx="3" fill="#1572b6"/>
    <rect x="1.5" y="86" width="297" height="24" fill="#4b2e9e"/>
    <rect x="20" y="95" width="36" height="6" rx="3" fill="#ffffff"/>
    <rect x="76" y="95" width="36" height="6" rx="3" fill="#ffffff"/>
    <rect x="132" y="95" width="36" height="6" rx="3" fill="#ffffff"/>
    <rect x="188" y="95" width="36" height="6" rx="3" fill="#ffffff"/>
    <rect x="16" y="122" width="268" height="66" rx="6" fill="#ffe1cc"/>
    <rect x="180" y="138" width="88" height="34" rx="6" fill="#ffffff" opacity="0.8"/>
    <rect x="16" y="198" width="80" height="44" rx="5" fill="#faf6ff" stroke="#ddd0f5"/>
    <rect x="110" y="198" width="80" height="44" rx="5" fill="#faf6ff" stroke="#ddd0f5"/>
    <rect x="204" y="198" width="80" height="44" rx="5" fill="#faf6ff" stroke="#ddd0f5"/>
    <rect x="1.5" y="250" width="297" height="18" fill="#f3edff"/>
  </g>

  <!-- Feature row -->
  <g fill="none" stroke="#4b2e9e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- tag icon -->
    <path d="M80 1320 L62 1340 L80 1360 M112 1320 L130 1340 L112 1360 M104 1314 L88 1366"/>
    <!-- brush icon -->
    <path d="M395 1315 L360 1350 M352 1352 Q340 1356 340 1368 Q352 1368 358 1360 Z"/>
    <path d="M388 1312 L400 1324"/>
    <!-- responsive icon -->
    <rect x="552" y="1318" width="44" height="32" rx="3"/>
    <path d="M566 1360 H582"/>
    <rect x="602" y="1328" width="18" height="32" rx="3"/>
    <!-- form icon -->
    <rect x="782" y="1314" width="44" height="54" rx="4"/>
    <path d="M792 1330 H816 M792 1342 H816 M792 1354 H806"/>
  </g>
  <g fill="#2b2140" font-size="21" font-weight="600">
    <text x="146" y="1335">Structure</text><text x="146" y="1361">with HTML</text>
    <text x="412" y="1335">Style</text><text x="412" y="1361">with CSS</text>
    <text x="632" y="1335">Responsive</text><text x="632" y="1361">Layouts</text>
    <text x="840" y="1335">Forms &amp;</text><text x="840" y="1361">Gallery</text>
  </g>
  <g stroke="#e8cdb8" stroke-width="2">
    <line x1="290" y1="1306" x2="290" y2="1376"/>
    <line x1="530" y1="1306" x2="530" y2="1376"/>
    <line x1="768" y1="1306" x2="768" y2="1376"/>
  </g>

  <!-- Bottom band -->
  <rect x="0" y="1400" width="1024" height="136" fill="#33206e"/>
  <rect x="62" y="1440" width="54" height="54" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="89" y="1476" fill="#ffffff" font-size="22" font-family="Menlo, monospace" text-anchor="middle">&lt;/&gt;</text>
  <text x="148" y="1462" fill="#ffffff" font-size="26">From a blank page to a real website.</text>
  <text x="148" y="1498" fill="#ffb48a" font-size="26">Your journey starts here.</text>
</svg>
